name: Build assets image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kubernetes/apps/assets/images/**"
      - "kubernetes/apps/assets/documents/**"
      - "kubernetes/apps/assets/Dockerfile"

permissions:
  contents: write

concurrency:
  group: assets-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: arc-runner-homelab
    timeout-minutes: 20
    env:
      IMAGE: harbor.alialjaffer.com/mirror/assets
    steps:
      - name: Mint app token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.HOMELAB_APP_ID }}
          private-key: ${{ secrets.HOMELAB_APP_PRIVATE_KEY }}
          owner: aliAljaffer
          repositories: homelab

      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app.outputs.token }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: harbor.alialjaffer.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: kubernetes/apps/assets
          file: kubernetes/apps/assets/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Smoke test
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          repo_count=$(find kubernetes/apps/assets/images -type f | wc -l | tr -d ' ')
          img_count=$(docker run --rm --entrypoint sh "${IMAGE}@${DIGEST}" \
            -c 'find /usr/share/nginx/html/images -type f | wc -l' | tr -d ' ')
          echo "repo files: $repo_count, image files: $img_count"
          test "$repo_count" = "$img_count"
          docker run --rm --entrypoint sh "${IMAGE}@${DIGEST}" \
            -c 'test -f /usr/share/nginx/html/documents/ali_aljaffer_cv.pdf'

      - name: Pin the image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          sed -i -E "s#(${IMAGE})@sha256:[0-9a-f]{64}#\1@${DIGEST}#" \
            kubernetes/apps/assets/deployment.yaml
          grep -q "${IMAGE}@${DIGEST}" kubernetes/apps/assets/deployment.yaml
          if git diff --quiet; then
            echo "The assets image is already pinned to ${DIGEST}."
            exit 0
          fi
          git config user.name "update-manifests-homelab[bot]"
          git config user.email "349350479+update-manifests-homelab[bot]@users.noreply.github.com"
          git add kubernetes/apps/assets/deployment.yaml
          git commit -m "assets: pin image for ${GITHUB_SHA:0:7}"
          for _ in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1
