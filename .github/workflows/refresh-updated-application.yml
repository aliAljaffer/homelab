name: Refresh updated application

on:
  push:
    branches: [main]
    paths:
      - "kubernetes/apps/**"

permissions:
  contents: read

jobs:
  refresh:
    if: >-
      github.event.head_commit != null &&
      (github.event.head_commit.author.username == 'update-manifests-homelab[bot]' ||
       github.actor == 'update-manifests-homelab[bot]')
    runs-on: arc-runner-homelab
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hard refresh changed applications
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$AFTER^..$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi

          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$range" -- kubernetes/apps)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No application manifests changed."
            exit 0
          fi

          api="https://kubernetes.default.svc"
          token=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          ca=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

          mapfile -t apps < <(printf '%s\n' "${files[@]}" | cut -d/ -f3 | sort -u)
          for app in "${apps[@]}"; do
            case "$app" in
              ""|.*) continue ;;
            esac

            url="$api/apis/argoproj.io/v1alpha1/namespaces/argocd/applications/$app"
            code=$(curl -sS -o /dev/null -w '%{http_code}' --cacert "$ca" \
              -H "Authorization: Bearer $token" "$url")
            case "$code" in
              200) ;;
              404)
                echo "::warning::Application $app not found; skipping."
                continue
                ;;
              *)
                echo "::error::Failed to read Application $app (HTTP $code)"
                exit 1
                ;;
            esac

            echo "Hard-refreshing $app"
            curl -sS --fail-with-body --cacert "$ca" \
              -H "Authorization: Bearer $token" \
              -H 'Content-Type: application/merge-patch+json' \
              -X PATCH \
              --data '{"metadata":{"annotations":{"argocd.argoproj.io/refresh":"hard"}}}' \
              "$url" >/dev/null
          done
