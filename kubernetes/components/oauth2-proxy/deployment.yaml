---
# Reusable oauth2-proxy for any app that has no auth gate of its own.
#
# This is a kustomize Component, not a standalone app. An application includes
# it and supplies two resources in its own namespace:
#
#   ConfigMap "oauth2-proxy-config"  OAUTH2_PROXY_UPSTREAMS / _REDIRECT_URL /
#                                    _COOKIE_DOMAINS / _WHITELIST_DOMAINS /
#                                    _EMAIL_DOMAINS
#   Secret    "oauth2-proxy-secret"  OAUTH2_PROXY_CLIENT_ID / _CLIENT_SECRET /
#                                    _COOKIE_SECRET
#
# The app's HTTPRoute then points at Service "oauth2-proxy" (port 80) instead of
# the app Service, and oauth2-proxy proxies on to OAUTH2_PROXY_UPSTREAMS once the
# user has authenticated. The OIDC client and secret live in Keycloak; see
# kubernetes/components/oauth2-proxy/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  labels:
    app.kubernetes.io/name: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8626eb70153f81ca0d88529ea7c63ef1eacaa15f84849eae13efd3f7000a7c14
          args:
            - --http-address=0.0.0.0:4180
            - --provider=oidc
            # Public issuer: the browser, not the pod, completes the login, and
            # Keycloak's discovered issuer must match this exactly.
            - --oidc-issuer-url=https://kc.alialjaffer.com/realms/homelab
            # TLS terminates at the Cilium Gateway. Cilium's Envoy DaemonSet is
            # host-networked, so X-Forwarded-* arrive from a node IP; trust only
            # the LAN range and not every source.
            - --reverse-proxy=true
            - --trusted-proxy-ip=192.168.8.0/24
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-expire=168h
            - --session-store-type=cookie
            - --code-challenge-method=S256
            - --skip-provider-button=true
          envFrom:
            - configMapRef:
                name: oauth2-proxy-config
            - secretRef:
                name: oauth2-proxy-secret
          ports:
            - name: http
              containerPort: 4180
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
