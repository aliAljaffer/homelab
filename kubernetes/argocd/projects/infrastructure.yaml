---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infrastructure
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  description: Cluster infrastructure (CNI, ingress, storage, monitoring)
  sourceRepos:
  - git@github.com:aliAljaffer/homelab.git
  - https://github.com/aliAljaffer/homelab.git
  - ghcr.io/thanos-community/helm-charts # OCI helm registry; no oci:// scheme (see apps/infrastructure/thanos.yaml)
  - ghcr.io/lexfrei/charts # OCI helm registry; no oci:// scheme (see apps/infrastructure/cloudflare-tunnel-gateway-controller.yaml)
  - quay.io/sustainable_computing_io/charts # OCI helm registry prefix for Kepler (no oci:// scheme); Argo appends chart name
  - https://helm.cilium.io/
  - https://charts.jetstack.io
  - https://metallb.github.io/metallb
  - https://charts.longhorn.io
  - https://kubernetes-sigs.github.io/external-dns/
  - https://prometheus-community.github.io/helm-charts
  - https://grafana.github.io/helm-charts
  - https://bitnami-labs.github.io/sealed-secrets
  - https://charts.bitnami.com/bitnami
  - https://vmware-tanzu.github.io/helm-charts
  - https://cloudnative-pg.io/charts
  - https://helm.releases.hashicorp.com
  - https://kyverno.github.io/kyverno/
  - https://falcosecurity.github.io/charts
  destinations:
  - server: https://kubernetes.default.svc
    namespace: "*"
  clusterResourceWhitelist:
  - group: "*"
    kind: "*"
  namespaceResourceWhitelist:
  - group: "*"
    kind: "*"
