---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  description: User workloads and applications
  sourceRepos:
  - git@github.com:aliAljaffer/homelab.git
  - https://openziti.io/helm-charts/ # ziti-controller + ziti-router charts
  # ArgoCD resolves OCI Helm charts from the scheme-less repo URL; keep the
  # oci:// form too for repository-scoped tooling.
  - ghcr.io/actions/actions-runner-controller-charts
  - oci://ghcr.io/actions/actions-runner-controller-charts
  destinations:
  - server: https://kubernetes.default.svc
    namespace: "*"
  clusterResourceWhitelist:
  - group: "*"
    kind: Namespace
  - group: "*"
    kind: ClusterRole
  - group: "*"
    kind: ClusterRoleBinding
  namespaceResourceWhitelist:
  - group: "*"
    kind: "*"
