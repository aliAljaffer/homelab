---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hindsight-chart
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: workloads
  source:
    repoURL: ghcr.io/vectorize-io/charts
    chart: hindsight
    targetRevision: 1.3.0
    helm:
      releaseName: hindsight
      valuesObject:
        version: 1.3.0
        existingSecret: hindsight-env
        postgresql:
          enabled: false
          external:
            host: hindsight-db-rw
            port: 5432
            database: hindsight
            username: hindsight
        api:
          replicaCount: 1
          # ghcr cuts single downloads at about 10 minutes, too short for this image's 1.1 GB layer.
          image:
            repository: harbor.alialjaffer.com/mirror/hindsight-api
          env:
            HINDSIGHT_API_LLM_PROVIDER: openai
            HINDSIGHT_API_LLM_BASE_URL: http://127.0.0.1:8899/v1
            HINDSIGHT_API_LLM_MODEL: free
            HINDSIGHT_API_LLM_VISION: "false"
            HINDSIGHT_API_LLM_MAX_RETRIES: "1"
            HINDSIGHT_API_LLM_TIMEOUT: "180"
            # The free OpenCode catalog includes models with a 32k output cap;
            # the default 64k is rejected when one of those serves a call.
            HINDSIGHT_API_RETAIN_MAX_COMPLETION_TOKENS: "32000"
            HINDSIGHT_API_RETAIN_BATCH_ENABLED: "false"
            # Four concurrent calls keeps retain moving without piling up on
            # the shared free-model rate limits.
            HINDSIGHT_API_LLM_MAX_CONCURRENT: "4"
            HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
            HINDSIGHT_API_RETAIN_EXTRACTION_MODE: custom
            HINDSIGHT_API_RETAIN_CUSTOM_INSTRUCTIONS: |
              Store a fact only if a future session, on a different task, would act differently because of it.
              Most turns contain nothing worth storing. Return no facts when nothing qualifies.
              Test each candidate: is it a lesson, fact, quirk, or workaround likely to come up again,
              or a process the user is likely to repeat? If not, drop it.

              STORE:
              - A preference, rule, or correction the user states about how to work, write, or build.
              - A durable fact about the user: role, accounts, machines, tools they use, naming conventions.
              - A niche project or infrastructure fact that is hard to rediscover: a hostname, port, bank ID,
                version pin, file location, dependency, or the reason a design was chosen.
              - The fix for a problem: the symptom, the root cause, and the change that solved it.
              - A workaround for an unsolved issue, with the condition that triggers it.
              - A decision the user made that later work must respect, and its reason.
              - A gotcha: a tool, API, or version that behaves differently from what its docs or common sense suggest.
              - A repeatable process: the ordered steps the user follows for a recurring task.

              NEVER STORE:
              - What an agent or subagent did, how long it ran, how many calls it made, or its exit status.
              - A complaint that output was incomplete, unverified, or missing (no SHA, no test output, "Done").
              - Progress narration, task status, plans, todo items, or "next I will" statements.
              - Restatements of the current request, or a summary of the conversation.
              - Transient state: a pod name, a run ID, a temporary path, a failing check that was then fixed.
              - Anything already in the repo, its README, or git history, unless the reason behind it is missing there.
              - Secrets, tokens, passwords, or keys.

              Write each fact so it stands alone: name the system, the condition, and the action.
              Prefer "In Hermes, X requires Y because Z" over "The agent found that X failed".
          extraContainers:
            - name: free-models
              image: harbor.alialjaffer.com/mirror/hindsight-api:1.3.0
              imagePullPolicy: IfNotPresent
              command:
                - /app/api/.venv/bin/python
                - /router/llm-router.py
              env:
                - name: HINDSIGHT_API_LLM_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: hindsight-env
                      key: HINDSIGHT_API_LLM_API_KEY
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: PORT
                  value: "8899"
                - name: LOG_LEVEL
                  value: INFO
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              ports:
                - name: router
                  containerPort: 8899
              livenessProbe:
                httpGet:
                  path: /healthz
                  port: router
                periodSeconds: 20
                failureThreshold: 3
              readinessProbe:
                httpGet:
                  path: /healthz
                  port: router
                periodSeconds: 10
                failureThreshold: 2
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: llm-router
                  mountPath: /router
                  readOnly: true
          extraVolumes:
            - name: llm-router
              configMap:
                name: hindsight-llm-router
          resources:
            requests:
              cpu: 250m
              memory: 1536Mi
            limits:
              memory: 3Gi
        worker:
          enabled: false
        controlPlane:
          enabled: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: hindsight
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
