---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc
  namespace: argocd
spec:
  project: workloads
  sources:
    - repoURL: git@github.com:aliAljaffer/homelab.git
      targetRevision: main
      ref: values
    - repoURL: git@github.com:aliAljaffer/homelab.git
      targetRevision: main
      path: kubernetes/apps/arc
    - repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set-controller
      targetRevision: 0.14.2
      helm:
        releaseName: arc-controller
        valueFiles:
          - $values/kubernetes/apps/arc/arc-controller-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-systems
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
