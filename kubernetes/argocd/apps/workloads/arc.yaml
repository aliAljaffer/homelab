---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc
  namespace: argocd
spec:
  project: workloads
  sources:
    - repoURL: git@github.com:aliAljaffer/homelab.git
      targetRevision: main
      path: kubernetes/apps/arc
    - repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set-controller
      targetRevision: 0.14.2
      helm:
        releaseName: arc-controller
        # The chart bundles large CRDs; kubectl-style apply exceeds the 256KB
        # annotation limit and the CRDs are already installed by the chart.
        # Reinstall CRDs manually when bumping the chart version.
        skipCrds: true
        valuesObject:
          # Undocumented in `helm show values` (only templates/deployment.yaml
          # has it); without it the chart hardcodes metrics off.
          metrics:
            controllerManagerAddr: ":8080"
            listenerAddr: ":8080"
            listenerEndpoint: "/metrics"
          resources:
            requests:
              cpu: 5m
              memory: 88Mi
            limits:
              memory: 176Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-systems
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
