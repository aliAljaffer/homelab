---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ziti-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
  - repoURL: ghcr.io/alialjaffer/charts
    # No oci:// scheme: ArgoCD auto-detects OCI and appends the chart name, and
    # the AppProject sourceRepos entry matches this exact prefix.
    chart: ziti-operator
    targetRevision: 0.1.2
    helm:
      valueFiles:
      - $values/kubernetes/infrastructure/ziti-operator/values.yaml
  - repoURL: git@github.com:aliAljaffer/homelab.git
    targetRevision: main
    ref: values
  - repoURL: git@github.com:aliAljaffer/homelab.git
    targetRevision: main
    path: kubernetes/infrastructure/ziti-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: ziti-operator-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - ServerSideDiff=true
