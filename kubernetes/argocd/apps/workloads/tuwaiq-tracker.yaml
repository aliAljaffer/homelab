---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tuwaiq-tracker
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: workloads
  source:
    repoURL: https://github.com/aliAljaffer/homelab.git
    targetRevision: main
    path: kubernetes/apps/tuwaiq-tracker
  destination:
    server: https://kubernetes.default.svc
    namespace: tuwaiq-tracker
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
