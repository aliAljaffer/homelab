---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexotv
  namespace: argocd
spec:
  project: workloads
  source:
    repoURL: git@github.com:aliAljaffer/homelab.git
    targetRevision: main
    path: kubernetes/apps/nexotv
  destination:
    server: https://kubernetes.default.svc
    namespace: stremio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
