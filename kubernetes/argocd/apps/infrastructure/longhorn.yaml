---
# Wave -3: Longhorn distributed storage
# BOOTSTRAP NOTE: First install done via 'helm install --no-hooks' to bypass pre-upgrade hook.
# See kubernetes/bootstrap/README.md Step 1 (Talos extensions) — requires iscsi-tools on workers.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
  - repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.8.1
    helm:
      valueFiles:
      - $values/kubernetes/infrastructure/longhorn/values.yaml
  - repoURL: git@github.com:aliAljaffer/homelab.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
