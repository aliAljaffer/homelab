---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vpa
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
  # Fairwinds packages the upstream kubernetes/autoscaler components as a chart.
  # The upstream in-tree chart is not used: ArgoCD clones the whole autoscaler
  # repo, which times out generating the manifest.
  - repoURL: https://charts.fairwinds.com/stable
    chart: vpa
    targetRevision: 5.2.0
    helm:
      valueFiles:
      - $values/kubernetes/infrastructure/vpa/values.yaml
  - repoURL: https://github.com/aliAljaffer/homelab.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: vpa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
