---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    repoURL: ghcr.io/stubbi/charts
    chart: hermes-operator
    targetRevision: 0.2.0
    helm:
      releaseName: hermes-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
