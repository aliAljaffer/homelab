---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/stubbi/hermes-operator
    targetRevision: v0.2.0
    path: charts/hermes-operator
    helm:
      releaseName: hermes-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes-operator-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
