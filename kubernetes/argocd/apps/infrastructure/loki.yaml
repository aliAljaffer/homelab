---
# Wave 0: Grafana Loki (log storage with MinIO backend, 90-day retention)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 6.29.0
      helm:
        valueFiles:
          - $values/kubernetes/infrastructure/loki/values.yaml
    - repoURL: https://github.com/aliAljaffer/homelab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/aliAljaffer/homelab.git
      targetRevision: main
      path: kubernetes/infrastructure/loki
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
