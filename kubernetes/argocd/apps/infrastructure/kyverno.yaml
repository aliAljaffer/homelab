---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
  - repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.8.2
    helm:
      valueFiles:
      - $values/kubernetes/infrastructure/kyverno/values.yaml
  - repoURL: git@github.com:aliAljaffer/homelab.git
    targetRevision: main
    ref: values
  - repoURL: git@github.com:aliAljaffer/homelab.git
    targetRevision: main
    path: kubernetes/infrastructure/kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  ignoreDifferences:
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
    jsonPointers:
    - /metadata/labels
    - /metadata/annotations
    - /spec/conversion
    - /status
  - group: kyverno.io
    kind: ClusterPolicy
    jsonPointers:
    - /spec/admission
    - /spec/emitWarning
    - /spec/validationFailureAction
    - /status
  - group: kyverno.io
    kind: ClusterPolicy
    jqPathExpressions:
    - .spec.rules[*].skipBackgroundRequests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
