---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: thanos
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
  - repoURL: ghcr.io/thanos-community/helm-charts
    # No oci:// scheme. With it, ArgoCD's token helper requests the wrong
    # OAuth scope and ghcr returns 403 (Application stuck at sync=Unknown).
    chart: thanos
    targetRevision: 0.21.0
    helm:
      valueFiles:
      - $values/kubernetes/infrastructure/thanos/values.yaml
  - repoURL: git@github.com:aliAljaffer/homelab.git
    targetRevision: main
    ref: values
  - repoURL: git@github.com:aliAljaffer/homelab.git
    targetRevision: main
    path: kubernetes/infrastructure/thanos
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  ignoreDifferences:
  - group: apps
    kind: StatefulSet
    jsonPointers:
    - /spec/persistentVolumeClaimRetentionPolicy
    - /spec/template/spec/containers/0/startupProbe/initialDelaySeconds
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
