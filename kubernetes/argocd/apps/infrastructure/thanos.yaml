---
# Wave 1: Thanos store-gateway + compactor + querier (long-term metrics, indefinite retention)
# Thanos sidecar runs inside Prometheus (configured in monitoring/values.yaml)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: thanos
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
  - repoURL: ghcr.io/thanos-community/helm-charts
    # NOTE: no oci:// scheme. ArgoCD auto-detects OCI by the chart+registry form.
    # With the oci:// prefix ArgoCD's token helper requests the wrong OAuth scope
    # (repository:<org>/<repo> instead of repository:<org>/<repo>/<chart>) and ghcr
    # returns 403; the Application sits at sync=Unknown with a ComparisonError.
    chart: thanos
    targetRevision: 0.21.0
    helm:
      valueFiles:
      - $values/kubernetes/infrastructure/thanos/values.yaml
  - repoURL: git@github.com:aliAljaffer/homelab.git
    targetRevision: main
    ref: values
  - repoURL: git@github.com:aliAljaffer/homelab.git
    targetRevision: main
    path: kubernetes/infrastructure/thanos
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
