---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: thanos
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
  # No oci:// prefix: ArgoCD's token helper gets a 403 from ghcr otherwise.
  - repoURL: ghcr.io/thanos-community/helm-charts
    chart: thanos
    targetRevision: 0.21.0
    helm:
      valueFiles:
      - $values/kubernetes/infrastructure/thanos/values.yaml
  - repoURL: git@github.com:aliAljaffer/homelab.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  ignoreDifferences:
  - group: apps
    kind: StatefulSet
    # volumeClaimTemplates are immutable; ignoring them prevents permanent OutOfSync.
    jsonPointers:
    - /spec/persistentVolumeClaimRetentionPolicy
    - /spec/template/spec/containers/0/startupProbe/initialDelaySeconds
    - /spec/volumeClaimTemplates
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
