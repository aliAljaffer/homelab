---
# Wave 1: Thanos store-gateway + compactor + querier (long-term metrics, indefinite retention)
# Thanos sidecar runs inside Prometheus (configured in monitoring/values.yaml)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: thanos
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
  - repoURL: oci://registry-1.docker.io/bitnamicharts
    chart: thanos
    targetRevision: 17.3.1
    helm:
      valueFiles:
      - $values/kubernetes/infrastructure/thanos/values.yaml
  - repoURL: git@github.com:aliAljaffer/homelab.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
