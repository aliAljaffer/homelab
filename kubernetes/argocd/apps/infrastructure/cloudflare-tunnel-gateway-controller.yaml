---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflare-tunnel-gateway-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
  - repoURL: ghcr.io/lexfrei/charts
    # No oci:// scheme here, see projects/infrastructure.yaml.
    chart: cloudflare-tunnel-gateway-controller
    targetRevision: 3.4.0
    helm:
      valueFiles:
      - $values/kubernetes/infrastructure/cloudflare-tunnel-gateway-controller/values.yaml
  - repoURL: git@github.com:aliAljaffer/homelab.git
    targetRevision: main
    ref: values
  - repoURL: git@github.com:aliAljaffer/homelab.git
    targetRevision: main
    path: kubernetes/infrastructure/cloudflare-tunnel-gateway-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflare-tunnel-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
