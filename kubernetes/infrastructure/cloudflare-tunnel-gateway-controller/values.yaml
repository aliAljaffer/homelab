---
gatewayClassConfig:
  create: true
  tunnelID: "f75afd15-0948-45ce-b6a1-67c69e4adabe"
  cloudflareCredentialsSecretRef:
    name: cloudflare-credentials

proxy:
  tunnelTokenSecretRef:
    name: cloudflare-tunnel-token
  networkPolicy:
    # Default policy only admits the controller's own namespace; without this,
    # Prometheus (in `monitoring`) can't reach the config-API/metrics port and
    # scrapes time out (TCP-level, not a 404).
    ingress:
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring

serviceMonitor:
  enabled: true
  labels:
    release: monitoring
