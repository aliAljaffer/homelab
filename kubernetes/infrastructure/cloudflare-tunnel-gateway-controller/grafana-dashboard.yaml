            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": "Thanos",
          "targets": [
            {
              "expr": "sum(cftunnel_ingress_rules)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "horizontal",
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "type": "timeseries",
          "title": "Proxy Request Rate",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "datasource": "Thanos",
          "targets": [
            {
              "expr": "sum by (pod) (rate(cftunnel_proxy_requests_total[5m]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
