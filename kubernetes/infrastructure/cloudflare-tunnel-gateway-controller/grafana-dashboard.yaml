          "datasource": "Thanos",
          "targets": [
            {
              "expr": "sum(rate(cftunnel_proxy_request_bytes_total[5m]))",
              "legendFormat": "request bytes/s",
              "refId": "A"
            },
            {
              "expr": "sum(rate(cftunnel_proxy_response_bytes_total[5m]))",
              "legendFormat": "response bytes/s",
              "refId": "B"
            }
