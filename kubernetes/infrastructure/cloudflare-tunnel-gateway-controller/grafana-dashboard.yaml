          "datasource": "Thanos",
          "targets": [
            {
              "expr": "sum(cloudflared_tunnel_ha_connections)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "horizontal",
            "colorMode": "value",
            "graphMode": "area"
