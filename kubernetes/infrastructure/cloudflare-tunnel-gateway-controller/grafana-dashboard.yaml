---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflare-tunnel-gateway-controller-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_dashboard_folder: Cloudflare Tunnel
data:
  cloudflare-tunnel-gateway-controller.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "title": "Cloudflare Tunnel Gateway Controller",
      "uid": "cloudflare-tunnel-gateway-controller",
      "version": 1,
      "tags": [
        "cloudflare",
        "tunnel",
        "gateway-api"
      ],
      "timezone": "browser",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "30s",
      "schemaVersion": 39,
      "fiscalYearStartMonth": 0,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "type": "stat",
          "title": "Proxy Requests In Flight",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": "Thanos",
          "targets": [
            {
              "expr": "sum(cftunnel_proxy_requests_in_flight)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "horizontal",
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "type": "stat",
          "title": "Active WebSocket Sessions",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": "Thanos",
          "targets": [
            {
              "expr": "sum(cftunnel_proxy_websocket_active_sessions)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "horizontal",
            "colorMode": "value",
            "graphMode": "area"
