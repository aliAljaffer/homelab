            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "horizontal",
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "type": "stat",
          "title": "Failed Backend Refs",
          "gridPos": {
            "x": 6,
            "y": 28,
            "w": 6,
            "h": 4
          },
          "datasource": "Thanos",
          "targets": [
            {
              "expr": "sum(cftunnel_failed_backend_refs)",
