---
# Public Gateway backed by a dedicated Cloudflare Tunnel.
# cloudflare-tunnel-gateway-controller takes exclusive ownership of this
# tunnel's ingress config - never add manual routes to it in the dashboard.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cloudflare-tunnel
  namespace: cloudflare-tunnel-system
spec:
  gatewayClassName: cloudflare-tunnel
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
