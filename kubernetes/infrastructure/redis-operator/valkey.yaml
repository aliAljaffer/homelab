---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: valkey
  namespace: redis-operator
spec:
  kubernetesConfig:
    image: docker.io/valkey/valkey:9.0.6-alpine@sha256:187679e3bd4036959631e3f03983ab2ba503ab21e6fd0454d508e909db2ee989
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
  # The exporter sidecar (and its 'valkey-metrics' Service) is what the
  # prometheus ServiceMonitor scrapes. CRD requires image; pinned digest
  # quay.io/opstree/redis-exporter:v1.89.0 (oci index, amd64+arm64).
  redisExporter:
    enabled: true
    image: quay.io/opstree/redis-exporter:v1.89.0@sha256:00a3628bdd3bb3423a15c5daefa328c471ee609798eed1744fe578c906d20cab
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        memory: 64Mi
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: longhorn
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
