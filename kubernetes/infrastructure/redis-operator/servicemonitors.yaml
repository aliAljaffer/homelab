---
apiVersion: v1
kind: Service
metadata:
  name: redis-operator-metrics
  namespace: redis-operator
  labels:
    app.kubernetes.io/name: redis-operator
spec:
  selector:
    name: redis-operator
  ports:
  - name: metrics
    port: 8080
    targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-operator
  namespace: redis-operator
  labels:
    release: monitoring
spec:
  endpoints:
  - port: metrics
    interval: 30s
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-operator
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: valkey-instances
  namespace: redis-operator
  labels:
    release: monitoring
spec:
  endpoints:
  - port: redis-exporter
    interval: 30s
  selector:
    matchLabels:
      app.kubernetes.io/component: metrics
    matchExpressions:
    - key: redis_setup_type
      operator: Exists
    - key: role
      operator: Exists
  namespaceSelector: {}
