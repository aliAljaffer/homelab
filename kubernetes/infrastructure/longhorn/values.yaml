---
defaultSettings:
  defaultReplicaCount: "2"
  defaultDataLocality: best-effort
  storageReservedPercentageForDefaultDisk: "15"

persistence:
  defaultClass: true
  defaultClassReplicaCount: "2"
  defaultFsType: ext4
  reclaimPolicy: Retain
  recurringJobSelector:
    enable: true
    jobList: '[{"name":"default","isGroup":true}]'

ingress:
  enabled: false

longhornUI:
  replicas: "1"

longhornManager:
  resources:
    requests:
      cpu: 60m
      memory: 384Mi
    limits:
      memory: 768Mi

metrics:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: monitoring
    metricRelabelings:
      - sourceLabels: [__name__]
        action: drop
        regex: 'longhorn_rest_client_.*|longhorn_workqueue_.*'

httproute:
  enabled: true
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: homelab-gateway
    namespace: kube-system
    sectionName: https
  hostnames: [ "lh.alialjaffer.com" ]
  path: /
  pathType: PathPrefix
  annotations: {}
