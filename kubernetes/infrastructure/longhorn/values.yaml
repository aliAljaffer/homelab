---
defaultSettings:
  defaultReplicaCount: "2"
  defaultDataLocality: best-effort
  storageReservedPercentageForDefaultDisk: "15"
  # backupTarget and backupTargetCredentialSecret are managed via
  # backup-target.yaml (BackupTarget CR) in this same kustomize path,
  # not here — Longhorn ignores defaultSettings for an already-created BackupTarget.

persistence:
  defaultClass: true
  defaultClassReplicaCount: "2"
  defaultFsType: ext4

# Exposed via Gateway API HTTPRoute (see cilium-config/httproute-longhorn.yaml)
ingress:
  enabled: false

longhornUI:
  replicas: "1"

httproute:
  enabled: true
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: homelab-gateway
    namespace: kube-system
    sectionName: https
  hostnames: [ "longhorn.alialjaffer.com" ]
  path: /
  pathType: PathPrefix
  annotations: {}
