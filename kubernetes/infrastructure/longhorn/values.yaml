---
defaultSettings:
  defaultReplicaCount: "2"
  defaultDataLocality: best-effort
  storageReservedPercentageForDefaultDisk: "15"
  # backupTarget and backupTargetCredentialSecret are managed via
  # backup-target.yaml (BackupTarget CR) in this same kustomize path,
  # not here — Longhorn ignores defaultSettings for an already-created BackupTarget.

persistence:
  defaultClass: true
  defaultClassReplicaCount: "2"
  defaultFsType: ext4
  recurringJobSelector:
    enable: true
    jobList: '[{"name":"default","isGroup":true}]'

# Exposed via Gateway API HTTPRoute (see cilium-config/httproute-longhorn.yaml)
ingress:
  enabled: false

longhornUI:
  replicas: "1"

# Only longhornManager exposes a resources key in this chart (v1.12.0).
# csi.* sidecars, longhornDriver, longhornUI, the longhorn-csi-plugin
# DaemonSet, and the per-version engine-image DaemonSets are unreachable
# via values.yaml - longhorn-manager creates several of these dynamically
# at runtime (engine-image is recreated per Longhorn upgrade), so even a
# manual patch wouldn't stick. See the Kyverno mutate policy in
# kubernetes/infrastructure/kyverno/policy-default-resources.yaml, which
# covers these instead.
longhornManager:
  resources:
    requests:
      cpu: 60m
      memory: 384Mi
    limits:
      cpu: 180m
      memory: 768Mi

metrics:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: monitoring

httproute:
  enabled: true
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: homelab-gateway
    namespace: kube-system
    sectionName: https
  hostnames: [ "lh.alialjaffer.com" ]
  path: /
  pathType: PathPrefix
  annotations: {}
