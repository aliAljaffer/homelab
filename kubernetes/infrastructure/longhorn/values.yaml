---
defaultSettings:
  defaultReplicaCount: "2"
  defaultDataLocality: best-effort
  storageReservedPercentageForDefaultDisk: "15"
  # backupTarget and backupTargetCredentialSecret are set via the BackupTarget
  # CR (backup-target.yaml), not here. Longhorn ignores defaultSettings for
  # an already-created BackupTarget.

persistence:
  defaultClass: true
  defaultClassReplicaCount: "2"
  defaultFsType: ext4
  reclaimPolicy: Retain
  recurringJobSelector:
    enable: true
    jobList: '[{"name":"default","isGroup":true}]'

# Exposed via the chart's native httproute block below instead.
ingress:
  enabled: false

longhornUI:
  replicas: "1"

# Only longhornManager exposes a resources key in this chart (v1.12.0). The
# csi.* sidecars, longhornDriver, longhornUI, and per-version engine-image
# DaemonSets are created dynamically at runtime and unreachable here, even a
# manual patch wouldn't stick. Kyverno's policy-default-resources covers
# those instead.
longhornManager:
  resources:
    requests:
      cpu: 60m
      memory: 384Mi
    limits:
      cpu: 180m
      memory: 768Mi

metrics:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: monitoring

httproute:
  enabled: true
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: homelab-gateway
    namespace: kube-system
    sectionName: https
  hostnames: [ "lh.alialjaffer.com" ]
  path: /
  pathType: PathPrefix
  annotations: {}
