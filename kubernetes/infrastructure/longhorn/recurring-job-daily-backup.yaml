---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backup
  namespace: longhorn-system
spec:
  cron: "0 2 * * *"
  task: backup
  groups:
  - default
  # 30 daily backups ~= one month of recovery window. The 2026 metrics-loss
  # incident needed data from 38 days back, which the old 14 kept for only two
  # weeks (see monitoring/README.md). Pair with the monthly job for longer reach.
  retain: 30
  concurrency: 1
  labels: {}
