---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexotv-tailnet
  namespace: stremio
  annotations:
    tailscale.com/proxy-group: tailnet-ingress
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - nexotv
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexotv
                port:
                  number: 7000
