---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-tailnet
  namespace: catus-locatus
  annotations:
    tailscale.com/proxy-group: tailnet-ingress
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - minio
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio-svc
                port:
                  number: 9001
