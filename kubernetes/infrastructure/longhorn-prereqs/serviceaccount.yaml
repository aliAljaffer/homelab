---
# Pre-create the service account required by the Longhorn pre-upgrade Helm hook.
# Without this, the hook job fails on fresh installs because the SA only exists
# after the main chart resources are deployed  -  a circular dependency.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-service-account
  namespace: longhorn-system
  labels:
    app.kubernetes.io/instance: longhorn
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/version: v1.8.1
    argocd.argoproj.io/instance: longhorn
    helm.sh/chart: longhorn-1.8.1
