---
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.11.0
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

credentials:
  useSecret: true
  existingSecret: cloud-credentials

configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: velero
      config:
        region: us-east-1
        s3ForcePathStyle: "true"
        s3Url: http://minio-svc.catus-locatus.svc.cluster.local:9000
      credential:
        name: cloud-credentials
        key: cloud

  volumeSnapshotLocation:
    - name: default
      provider: aws
      config:
        region: us-east-1
      credential:
        name: cloud-credentials
        key: cloud

  defaultVolumesToFsBackup: true

deployNodeAgent: true
