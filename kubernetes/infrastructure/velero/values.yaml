---
initContainers:
  - name: velero-plugin-for-gcp
    image: velero/velero-plugin-for-gcp:v1.14.2
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

credentials:
  useSecret: true
  existingSecret: cloud-credentials

configuration:
  backupStorageLocation:
    - name: default
      provider: gcp
      bucket: alialjaffer-homelab
      prefix: velero
      credential:
        name: cloud-credentials
        key: cloud

  volumeSnapshotLocation:
    - name: default
      provider: gcp
      credential:
        name: cloud-credentials
        key: cloud

  defaultVolumesToFsBackup: true
  features: EnableCSI

deployNodeAgent: true

resources:
  requests:
    cpu: 15m
    memory: 392Mi
  limits:
    cpu: 45m
    memory: 784Mi

nodeAgent:
  resources:
    requests:
      cpu: 15m
      memory: 128Mi
    limits:
      cpu: 45m
      memory: 256Mi

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: monitoring
