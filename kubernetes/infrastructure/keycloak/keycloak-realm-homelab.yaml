---
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: homelab
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  placeholders:
    SMTP_PASSWORD:
      secret:
        name: keycloak-smtp-secret
        key: SMTP_PASSWORD
  realm:
    id: homelab
    realm: homelab
    displayName: Homelab
    enabled: true
    smtpServer:
      host: smtp.resend.com
      port: "587"
      from: homelab@alialjaffer.com
      fromDisplayName: Homelab
      user: resend
      password: "${SMTP_PASSWORD}"
      auth: "true"
      starttls: "true"
      ssl: "false"
