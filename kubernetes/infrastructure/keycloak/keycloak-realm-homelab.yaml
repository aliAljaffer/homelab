---
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: homelab
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  placeholders:
    SMTP_PASSWORD:
      secret:
        name: keycloak-smtp-secret
        key: SMTP_PASSWORD
    OAUTH2_PROXY_CLIENT_SECRET:
      secret:
        name: keycloak-oauth2-proxy-secret
        key: CLIENT_SECRET
  realm:
    id: homelab
    realm: homelab
    displayName: Homelab
    enabled: true
    smtpServer:
      host: smtp-relay.mail.svc.cluster.local
      port: "587"
      from: homelab@alialjaffer.com
      fromDisplayName: Homelab
      user: resend
      password: "${SMTP_PASSWORD}"
      auth: "false"
      starttls: "false"
      ssl: "false"
    clients:
      - clientId: oauth2-proxy
        name: oauth2-proxy
        enabled: true
        protocol: openid-connect
        publicClient: false
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        secret: "${OAUTH2_PROXY_CLIENT_SECRET}"
        redirectUris:
          - "https://ntfy.alialjaffer.com/oauth2/callback"
        webOrigins:
          - "https://ntfy.alialjaffer.com"
        attributes:
          pkce.code.challenge.method: S256
      - clientId: fai
        name: fai
        enabled: true
        protocol: openid-connect
        publicClient: true
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - "https://fai.alialjaffer.com/*"
        webOrigins:
          - "https://fai.alialjaffer.com"
        attributes:
          pkce.code.challenge.method: S256
