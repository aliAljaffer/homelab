---
# 3-instance Postgres cluster for Keycloak, managed by the CloudNativePG operator.
# App credentials are auto-generated by CNPG into the "keycloak-db-app" Secret
# (keys: username, password, dbname, host, port, uri, ...).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
  namespace: keycloak
spec:
  instances: 3
  storage:
    size: 5Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
