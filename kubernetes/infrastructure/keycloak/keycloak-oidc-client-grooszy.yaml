---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: grooszy
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  realm: homelab
  client:
    enabled: true
    loginFlows:
      - STANDARD
    redirectUris:
      - https://grooszy.alialjaffer.com/api/auth/callback
      - https://grooszy-dev.alialjaffer.com/api/auth/callback
      - http://127.0.0.1:3000/api/auth/callback
    webOrigins:
      - https://grooszy.alialjaffer.com
      - https://grooszy-dev.alialjaffer.com
      - http://127.0.0.1:3000
    auth:
      method: client-secret
      secretRef:
        name: grooszy-oidc-secret
        key: CLIENT_SECRET
