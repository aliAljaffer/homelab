---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: harbor
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  realm: homelab
  client:
    enabled: true
    loginFlows:
      - STANDARD
    redirectUris:
      - https://harbor.alialjaffer.com/c/oidc/callback
    webOrigins:
      - https://harbor.alialjaffer.com
    auth:
      method: client-secret
      secretRef:
        name: harbor-oidc-secret
        key: CLIENT_SECRET
