---
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 3
  resources:
    requests:
      memory: 1Gi
    limits:
      memory: 2Gi
  db:
    vendor: postgres
    host: keycloak-db-rw.keycloak.svc.cluster.local
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-db-app
      key: username
    passwordSecret:
      name: keycloak-db-app
      key: password
  http:
    httpEnabled: true
  additionalOptions:
    - name: metrics-enabled
      value: "true"
  # The operator's ServiceMonitor lacks release=monitoring; monitoring ships its own.
  serviceMonitor:
    enabled: false
  hostname:
    hostname: kc.alialjaffer.com
  ingress:
    enabled: false
  proxy:
    headers: xforwarded
  features:
    enabled:
      - client-admin-api:v2
