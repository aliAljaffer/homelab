---
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 3
  db:
    vendor: postgres
    host: keycloak-db-rw.keycloak.svc.cluster.local
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-db-app
      key: username
    passwordSecret:
      name: keycloak-db-app
      key: password
  http:
    httpEnabled: true
  # Enable the /metrics endpoint on the management port (9000).
  additionalOptions:
    - name: metrics-enabled
      value: "true"
  # The operator generates a ServiceMonitor but without the release=monitoring
  # label the monitoring Prometheus never selects it. We ship our own monitor
  # in the monitoring app instead, so disable the generated one.
  serviceMonitor:
    enabled: false
  hostname:
    hostname: kc.alialjaffer.com
  ingress:
    enabled: false
  proxy:
    headers: xforwarded
