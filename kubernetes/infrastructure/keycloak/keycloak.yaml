---
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 3
  # The operator default is a 1700Mi request / 2Gi limit per instance; real use
  # is ~650Mi. Keep the limit, drop the request so three Keycloaks stop
  # reserving 5Gi across the workers.
  resources:
    requests:
      memory: 1Gi
    limits:
      memory: 2Gi
  db:
    vendor: postgres
    host: keycloak-db-rw.keycloak.svc.cluster.local
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-db-app
      key: username
    passwordSecret:
      name: keycloak-db-app
      key: password
  http:
    httpEnabled: true
  # Enable the /metrics endpoint on the management port (9000).
  additionalOptions:
    - name: metrics-enabled
      value: "true"
  # The operator generates a ServiceMonitor but without the release=monitoring
  # label the monitoring Prometheus never selects it. We ship our own monitor
  # in the monitoring app instead, so disable the generated one.
  serviceMonitor:
    enabled: false
  hostname:
    hostname: kc.alialjaffer.com
  ingress:
    enabled: false
  proxy:
    headers: xforwarded
  features:
    enabled:
      - client-admin-api:v2
