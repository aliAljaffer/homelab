---
# Admin bootstrap credentials are auto-generated by the operator into the
# "keycloak-initial-admin" Secret if bootstrapAdmin is left unset.
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 3
  db:
    vendor: postgres
    host: keycloak-db-rw.keycloak.svc.cluster.local
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-db-app
      key: username
    passwordSecret:
      name: keycloak-db-app
      key: password
  http:
    httpEnabled: true
  hostname:
    hostname: keycloak.alialjaffer.com
  ingress:
    enabled: false
  proxy:
    headers: xforwarded
