# Default-deny + explicit-allow for the keycloak namespace.
# Matrix source: CONTEXT-networkpolicy-audit.md
#
# NOT yet wired into kustomization.yaml. Apply only after
# kubernetes/bootstrap/cilium/values.yaml's policyAuditMode: true has been
# rolled out and confirmed live (helm upgrade), so a mistake here logs
# instead of dropping real traffic.
#
# Namespace already ships one plain NetworkPolicy from the keycloak-operator
# chart (keycloak-network-policy, policyTypes: [Ingress] only) that allows
# unrestricted ingress to the keycloak app pods on 8080/9000. Kubernetes
# NetworkPolicies for the same pods are additive (allow-unions), so a second
# ingress rule here would not narrow anything - only egress is actually open
# today for those pods, hence the app-pod policy below is Egress-only.
#
# Caveats:
# - The keycloak app's SMTP host (SES, for the "homelab" realm's email
#   settings) is configured at runtime via the Keycloak Admin API, not in
#   any manifest in this repo - grepped keycloak-smtp-secret.sealed.yaml and
#   keycloak.yaml, neither declares a host. Confirm the actual SMTP_HOST from
#   the realm settings before adding a toFQDNs egress rule for it; until
#   then this will show up as a drop in audit-mode logs when an invite email
#   sends.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keycloak-operator-egress
  namespace: keycloak
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak-operator
  egress:
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keycloak-app-egress
  namespace: keycloak
spec:
  endpointSelector:
    matchLabels:
      app: keycloak
      app.kubernetes.io/managed-by: keycloak-operator
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: keycloak-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keycloak-db-default
  namespace: keycloak
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: keycloak-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: keycloak
            app.kubernetes.io/managed-by: keycloak-operator
        - matchLabels:
            cnpg.io/cluster: keycloak-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
    # Flag #2 in CONTEXT-networkpolicy-audit.md: CNPG operator -> instance
    # (failover/switchover/backup orchestration) wasn't observed live during
    # the capture window. Pre-allowing per the doc's option (a).
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": cnpg-system
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: keycloak-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
