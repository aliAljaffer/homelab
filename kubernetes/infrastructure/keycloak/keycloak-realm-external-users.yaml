---
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: external-users
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  placeholders:
    SMTP_PASSWORD:
      secret:
        name: keycloak-smtp-secret
        key: SMTP_PASSWORD
  realm:
    id: external-users
    realm: external-users
    displayName: External Users
    enabled: true
    smtpServer:
      host: smtp-relay.mail.svc.cluster.local
      port: "587"
      from: homelab@alialjaffer.com
      fromDisplayName: External Users
      user: resend
      password: "${SMTP_PASSWORD}"
      auth: "false"
      starttls: "false"
      ssl: "false"
