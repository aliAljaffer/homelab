---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-public
  namespace: keycloak
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: cloudflare-tunnel
      namespace: cloudflare-tunnel-system
      sectionName: https
  hostnames:
    - kc.alialjaffer.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /realms/homelab
      backendRefs:
        - name: keycloak-service
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /resources
      backendRefs:
        - name: keycloak-service
          port: 8080
    - matches:
        - path:
            type: Exact
            value: /robots.txt
      backendRefs:
        - name: keycloak-service
          port: 8080
