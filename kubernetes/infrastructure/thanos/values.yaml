---
global:
  objstore:
    createSecret: false
    secretName: thanos-objstore-secret # sealed in bootstrap/README.md
    secretKey: objstore.yml # must match the key in the sealed secret
  # Applies to query, storegateway, and compactor.
  serviceMonitor:
    enabled: true
    labels:
      release: monitoring

query:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 264Mi
    limits:
      memory: 528Mi
  replicaLabels:
  - prometheus_replica
  endpoints:
    autogen:
      enabled: true # wires up the in-chart storegateway automatically
    static:
    - prometheus-operated.monitoring.svc.cluster.local:10901
    - dnssrv+_grpc._tcp.kube-prometheus-kube-prome-thanos-discovery.monitoring.svc.cluster.local

storegateway:
  enabled: true
  # Bumped 2026-10-17: clearing /var/thanos/store (the index-header cache, see
  # monitoring/README.md "Manual bucket mutations") forces a cold rebuild of
  # every block's index-header on next startup instead of the usual
  # incremental build for new blocks only. With ~480 blocks that rebuild spike
  # alone exceeded the old 1280Mi limit and OOMKilled both replicas in a crash
  # loop. 1280Mi -> 2560Mi -> 4096Mi, still OOMKilling repeatedly (both
  # replicas, tens of minutes apart, not just on startup) -- nodes have
  # plenty of headroom (28-68% memory used cluster-wide) so this isn't a node
  # capacity problem. Bumped again pending a proper investigation into
  # whether this is a real steady-state requirement at this block count or an
  # actual leak; don't be surprised if this needs to go even higher or if the
  # root cause turns out to be something other than "needs more memory."
  resources:
    requests:
      cpu: 5m
      memory: 640Mi
    limits:
      memory: 6144Mi
  # No request-size limit exists by default (store.grpc.downloaded-bytes-limit
  # is 0 = unbounded), so a single wide/expensive query could pull unlimited
  # chunk data into memory on top of the already-reserved 2GB chunk pool +
  # 250MB index cache. Caps one request's blast radius without throttling
  # normal concurrent dashboard load (series-max-concurrency default of 20 is
  # untouched).
  extraArgs:
    - --store.grpc.downloaded-bytes-limit=2GB
  persistence:
    enabled: true
    storageClass: longhorn
    size: 10Gi

compactor:
  enabled: true
  # Steady-state use is ~50Mi; downsample/compaction spikes are covered by the
  # limit, not the request, so the old 2296Mi request only reserved capacity it
  # never used.
  resources:
    requests:
      cpu: 30m
      memory: 512Mi
    limits:
      memory: 4592Mi
  retention:
    resolutionRaw: "" # empty means keep forever
    resolution5m: ""
    resolution1h: ""
  # The compactor downloads every block it intends to compact into this volume,
  # so it must be comfortably larger than the raw metrics footprint. It filled up
  # the original 10Gi on 2026-10-16 and halted (`preallocate: no space left on
  # device`), which stops all downsampling and retention. 50Gi gives headroom.
  # NOTE: spec.volumeClaimTemplates is immutable on StatefulSets, so changing
  # this value does NOT resize an existing PVC. See README.md for the manual
  # expansion procedure.
  persistence:
    enabled: true
    storageClass: longhorn
    size: 50Gi

ruler:
  enabled: false

receive:
  enabled: false
