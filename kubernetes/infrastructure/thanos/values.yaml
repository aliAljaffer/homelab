---
global:
  objstore:
    createSecret: false
    secretName: thanos-objstore-secret # sealed in bootstrap/README.md
    secretKey: objstore.yml # must match the key in the sealed secret
  # Applies to query, storegateway, and compactor.
  serviceMonitor:
    enabled: true
    labels:
      release: monitoring

query:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 264Mi
    limits:
      memory: 528Mi
  replicaLabels:
  - prometheus_replica
  endpoints:
    autogen:
      enabled: true # wires up the in-chart storegateway automatically
    static:
    - prometheus-operated.monitoring.svc.cluster.local:10901
    - dnssrv+_grpc._tcp.kube-prometheus-kube-prome-thanos-discovery.monitoring.svc.cluster.local

storegateway:
  enabled: true
  # Bumped 2026-10-17: clearing /var/thanos/store (the index-header cache, see
  # monitoring/README.md "Manual bucket mutations") forces a cold rebuild of
  # every block's index-header on next startup instead of the usual
  # incremental build for new blocks only. With ~480 blocks that rebuild spike
  # alone exceeded the old 1280Mi limit and OOMKilled both replicas in a crash
  # loop. 2560Mi got both through the rebuild, but storegateway-0 kept dying
  # afterward too -- it finished loading, started serving queries, then
  # OOMKilled ~1-2 minutes later -- so this isn't just a one-time rebuild
  # spike: steady-state query-serving memory needs headroom too, now that the
  # block count has roughly doubled from the 2026-10 recovery work.
  resources:
    requests:
      cpu: 5m
      memory: 640Mi
    limits:
      memory: 4096Mi
  persistence:
    enabled: true
    storageClass: longhorn
    size: 10Gi

compactor:
  enabled: true
  resources:
    requests:
      cpu: 30m
      memory: 2296Mi
    limits:
      memory: 4592Mi
  retention:
    resolutionRaw: "" # empty means keep forever
    resolution5m: ""
    resolution1h: ""
  # The compactor downloads every block it intends to compact into this volume,
  # so it must be comfortably larger than the raw metrics footprint. It filled up
  # the original 10Gi on 2026-10-16 and halted (`preallocate: no space left on
  # device`), which stops all downsampling and retention. 50Gi gives headroom.
  # NOTE: spec.volumeClaimTemplates is immutable on StatefulSets, so changing
  # this value does NOT resize an existing PVC. See README.md for the manual
  # expansion procedure.
  persistence:
    enabled: true
    storageClass: longhorn
    size: 50Gi

ruler:
  enabled: false

receive:
  enabled: false
