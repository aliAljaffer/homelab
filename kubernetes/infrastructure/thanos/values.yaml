# kubernetes/infrastructure/thanos/values.yaml
---
global:
  objstore:
    createSecret: false
    secretName: thanos-objstore-secret # SealedSecret: see bootstrap/README.md
    secretKey: objstore.yml # confirm this matches the key inside your sealed secret

query:
  enabled: true
  replicaLabels:
  - prometheus_replica
  endpoints:
    autogen:
      enabled: true # auto-wires the in-chart storegateway
    static:
    - prometheus-operated.monitoring.svc.cluster.local:10901
    - dnssrv+_grpc._tcp.kube-prometheus-kube-prome-thanos-discovery.monitoring.svc.cluster.local

storegateway:
  enabled: true
  persistence:
    enabled: true
    storageClass: longhorn
    size: 10Gi

compactor:
  enabled: true
  retention:
    resolutionRaw: "" # keep raw metrics forever
    resolution5m: "" # keep 5m downsampled forever
    resolution1h: "" # keep 1h downsampled forever
  persistence:
    enabled: true
    storageClass: longhorn
    size: 10Gi

ruler:
  enabled: false

receive:
  enabled: false
