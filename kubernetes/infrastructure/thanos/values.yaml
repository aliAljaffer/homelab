---
global:
  objstore:
    createSecret: false
    secretName: thanos-objstore-secret
    secretKey: objstore.yml
  serviceMonitor:
    enabled: true
    labels:
      release: monitoring

query:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 264Mi
    limits:
      memory: 528Mi
  replicaLabels:
  - prometheus_replica
  endpoints:
    autogen:
      enabled: true
    static:
    - prometheus-operated.monitoring.svc.cluster.local:10901
    - dnssrv+_grpc._tcp.kube-prometheus-kube-prome-thanos-discovery.monitoring.svc.cluster.local

storegateway:
  enabled: true
  resources:
    requests:
      cpu: 5m
      memory: 640Mi
    limits:
      memory: 6144Mi
  extraArgs:
    - --store.grpc.downloaded-bytes-limit=2GB
  persistence:
    enabled: true
    storageClass: longhorn
    size: 10Gi

compactor:
  enabled: true
  resources:
    requests:
      cpu: 30m
      memory: 512Mi
    limits:
      memory: 4592Mi
  retention:
    resolutionRaw: ""
    resolution5m: ""
    resolution1h: ""
  # volumeClaimTemplates are immutable; resize existing PVCs manually (see README).
  persistence:
    enabled: true
    storageClass: longhorn
    size: 50Gi

ruler:
  enabled: false

receive:
  enabled: false
