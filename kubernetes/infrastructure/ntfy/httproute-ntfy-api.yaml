---
# Direct-to-ntfy hostname for the iOS app (and any other non-browser client).
# It has no oauth2-proxy in front because those clients cannot complete an
# interactive OIDC login; ntfy's own basic auth / access tokens still apply.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ntfy-api
  namespace: ntfy
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: cloudflare-tunnel
      namespace: cloudflare-tunnel-system
      sectionName: https
  hostnames:
    - ntfy-api.alialjaffer.com
  rules:
    - backendRefs:
        - name: ntfy
          port: 80
