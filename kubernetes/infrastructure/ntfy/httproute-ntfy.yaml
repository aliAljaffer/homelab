---
# Browser-facing hostname, gated by Keycloak through the shared oauth2-proxy
# component. ntfy cannot consume the OIDC identity itself, so the web app still
# asks for ntfy credentials once; this only hides the public UI shell.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ntfy
  namespace: ntfy
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: cloudflare-tunnel
      namespace: cloudflare-tunnel-system
      sectionName: https
  hostnames:
    - ntfy.alialjaffer.com
  rules:
    - backendRefs:
        - name: oauth2-proxy
          port: 80
