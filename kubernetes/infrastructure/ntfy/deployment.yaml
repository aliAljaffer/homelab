---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: ntfy
  labels:
    app: ntfy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
    spec:
      initContainers:
        - name: bootstrap-auth
          image: binwiederhier/ntfy
          command:
            - sh
            - -c
            - |
              set -eu
              touch /var/lib/ntfy/auth.db
              NTFY_PASSWORD="$NTFY_ADMIN_PASSWORD" ntfy user --auth-file /var/lib/ntfy/auth.db add --ignore-exists --role=admin ali
              NTFY_PASSWORD="$NTFY_PUBLISHER_PASSWORD" ntfy user --auth-file /var/lib/ntfy/auth.db add --ignore-exists fai-publisher
              ntfy access --auth-file /var/lib/ntfy/auth.db fai-publisher 'tasks-*' write-only
          envFrom:
            - secretRef:
                name: ntfy-credentials
          volumeMounts:
            - name: ntfy-data
              mountPath: /var/lib/ntfy
      containers:
        - name: ntfy
          image: binwiederhier/ntfy
          args: ["serve"]
          ports:
            - containerPort: 80
          volumeMounts:
            - name: ntfy-data
              mountPath: /var/lib/ntfy
            - name: ntfy-config
              mountPath: /etc/ntfy
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: ntfy-data
          persistentVolumeClaim:
            claimName: ntfy-data
        - name: ntfy-config
          configMap:
            name: ntfy-config
