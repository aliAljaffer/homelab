---
# Extra resources deployed alongside the MetalLB Helm release.
# Referenced by kubernetes/argocd/apps/infrastructure/metallb.yaml.
# NOTE: distinct from kubernetes/infrastructure/metallb/config, which is its
# own ArgoCD Application (metallb-config) for IPAddressPool/L2Advertisement.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - grafana-dashboard.yaml
  - frr-k8s-metrics-rbac.yaml
  - podmonitor-frr-k8s.yaml
