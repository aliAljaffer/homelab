---
controller:
  resources:
    requests:
      cpu: 5m
      memory: 232Mi
    limits:
      cpu: 20m
      memory: 464Mi

speaker:
  tolerateMaster: true
  resources:
    requests:
      cpu: 20m
      memory: 56Mi
    limits:
      cpu: 60m
      memory: 112Mi

# frr-k8s is a real Helm dependency, not a values passthrough. Its keys use
# the subchart's own schema, nested one level deeper under the "frr-k8s"
# alias (metallb's own values.yaml only has `frrk8s.enabled`).
frr-k8s:
  frrk8s:
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        cpu: 20m
        memory: 64Mi
    frr:
      # This container runs 5 FRR sub-daemons (bgpd, staticd, bfdd, mgmtd,
      # watchfrr). 20m/112Mi (the standard formula from idle p95/max
      # observed) starved daemon startup badly enough that watchfrr's 90s
      # startup timeout killed them before they finished initializing,
      # producing a boot-loop (SIGTERM, exit 143) - not a steady-state
      # sizing problem. Idle usage doesn't reflect the CPU burst multiple
      # daemons need to actually start.
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
    reloader:
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          cpu: 20m
          memory: 32Mi
    frrMetrics:
      resources:
        requests:
          cpu: 15m
          memory: 56Mi
        limits:
          cpu: 45m
          memory: 112Mi
    frrStatus:
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          cpu: 20m
          memory: 64Mi

prometheus:
  rbacPrometheus: true
  serviceAccount: kube-prometheus-prometheus
  namespace: monitoring
  serviceMonitor:
    enabled: true
    speaker:
      additionalLabels:
        release: monitoring
    controller:
      additionalLabels:
        release: monitoring
