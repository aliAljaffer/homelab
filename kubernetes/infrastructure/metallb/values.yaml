---
controller:
  resources:
    requests:
      cpu: 5m
      memory: 232Mi
    limits:
      cpu: 20m
      memory: 464Mi

speaker:
  tolerateMaster: true
  resources:
    requests:
      cpu: 20m
      memory: 56Mi
    limits:
      cpu: 60m
      memory: 112Mi

# frr-k8s is a real Helm dependency (not just a values passthrough) - its
# keys use the subchart's own schema, nested one level deeper under the
# "frr-k8s" alias (see charts/frr-k8s/values.yaml in the metallb chart for
# the schema; metallb's own values.yaml only has `frrk8s.enabled`).
frr-k8s:
  frrk8s:
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        cpu: 20m
        memory: 64Mi
    frr:
      resources:
        requests:
          cpu: 5m
          memory: 56Mi
        limits:
          cpu: 20m
          memory: 112Mi
    reloader:
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          cpu: 20m
          memory: 32Mi
    frrMetrics:
      resources:
        requests:
          cpu: 15m
          memory: 56Mi
        limits:
          cpu: 45m
          memory: 112Mi
    frrStatus:
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          cpu: 20m
          memory: 64Mi

prometheus:
  rbacPrometheus: true
  serviceAccount: kube-prometheus-prometheus
  namespace: monitoring
  serviceMonitor:
    enabled: true
    speaker:
      additionalLabels:
        release: monitoring
    controller:
      additionalLabels:
        release: monitoring

# frr-k8s's ServiceMonitor has no additionalLabels field in its chart schema
# (checked v0.16.1), so it can't carry the release: monitoring label our
# Prometheus instance requires (serviceMonitorSelector.matchLabels).
# Left disabled; would need a separate ServiceMonitor manifest + label patch
# to actually get scraped.
