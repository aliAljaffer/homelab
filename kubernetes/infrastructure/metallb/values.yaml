---
controller:
  resources:
    requests:
      cpu: 5m
      memory: 232Mi
    limits:
      memory: 464Mi

speaker:
  tolerateMaster: true
  resources:
    requests:
      cpu: 20m
      memory: 56Mi
    limits:
      memory: 112Mi

frr-k8s:
  frrk8s:
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        memory: 64Mi
    frr:
      resources:
        requests:
          cpu: 250m
          memory: 64Mi
        limits:
          memory: 256Mi
    reloader:
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          memory: 32Mi
    frrMetrics:
      resources:
        requests:
          cpu: 15m
          memory: 56Mi
        limits:
          memory: 112Mi
    frrStatus:
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 64Mi

prometheus:
  rbacPrometheus: true
  serviceAccount: kube-prometheus-prometheus
  namespace: monitoring
  serviceMonitor:
    enabled: true
    speaker:
      additionalLabels:
        release: monitoring
    controller:
      additionalLabels:
        release: monitoring
