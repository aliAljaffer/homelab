---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: smtp-relay
  namespace: mail
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: smtp-relay
  ingress:
    - fromEntities:
        - host
        - health
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": falco
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": keycloak
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": vaultwarden
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": argocd
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": fai
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": grooszy-dev
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": grooszy
      toPorts:
        - ports:
            - port: "587"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
      toPorts:
        - ports:
            - port: "9154"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: "smtp.resend.com"
      toPorts:
        - ports:
            - port: "587"
              protocol: TCP
