---
apiVersion: v1
kind: Service
metadata:
  name: smtp-relay
  namespace: mail
  labels:
    app.kubernetes.io/name: smtp-relay
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: smtp-relay
  ports:
    - name: smtp
      port: 587
      targetPort: 587
      protocol: TCP
    - name: metrics
      port: 9154
      targetPort: metrics
      protocol: TCP
