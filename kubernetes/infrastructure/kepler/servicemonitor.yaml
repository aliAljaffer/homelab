---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kepler
  namespace: kepler
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: kepler
      app.kubernetes.io/name: kepler
  endpoints:
    - port: http
      interval: 5s
      path: /metrics
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: kepler_process_.*
          action: drop
