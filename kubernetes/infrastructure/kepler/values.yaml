---
image:
  repository: quay.io/sustainable_computing_io/kepler
  pullPolicy: IfNotPresent
  tag: v0.11.4

namespace:
  create: false   # namespace.yaml in this kustomization creates it
  name: kepler

serviceAccount:
  create: true
  name: kepler

rbac:
  create: true

service:
  type: ClusterIP
  port: 28282

daemonset:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule

  # Needs host /proc and /sys, reachable only via the talosctl mount patch.
  # The chart bind-mounts them into the pod from there.
  hostPID: true
  hostUsers: true
  securityContext:
    privileged: true
    runAsNonRoot: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  livenessProbe:
    httpGet:
      path: /metrics
      port: http
    initialDelaySeconds: 10
    periodSeconds: 60
    timeoutSeconds: 10

config:
  log:
    level: info
    format: text
  host:
    sysfs: /host/sys
    procfs: /host/proc
  monitor:
    interval: 5s
    staleness: 500ms
  # Do NOT set kube.enabled here. The chart hardcodes --kube.enable
  # --kube.node-name=$(NODE_NAME) as CLI args on the DaemonSet. Setting it
  # in the ConfigMap fails validation because nodeName is empty in the YAML.
  exporter:
    prometheus:
      enabled: true
      debugCollectors:
        - go

# release: monitoring label is required to match Prometheus's serviceMonitorSelector.
serviceMonitor:
  enabled: true
  interval: 5s
  path: /metrics
  labels:
    release: monitoring
  annotations: {}

networkPolicy:
  enabled: false