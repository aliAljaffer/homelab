---
image:
  repository: quay.io/sustainable_computing_io/kepler
  pullPolicy: IfNotPresent
  tag: v0.11.4@sha256:45571f233951fb96c3a2900e1d5e4cbb4ade9cd36ed419dcd87661e067168fdf

namespace:
  create: false
  name: kepler

serviceAccount:
  create: true
  name: kepler

rbac:
  create: true

service:
  type: ClusterIP
  port: 28282

daemonset:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule

  hostPID: true
  hostUsers: true
  securityContext:
    privileged: true
    runAsNonRoot: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

  livenessProbe:
    httpGet:
      path: /metrics
      port: http
    initialDelaySeconds: 10
    periodSeconds: 60
    timeoutSeconds: 10

# Do not add kube.enabled; the chart hardcodes --kube.enable and nodeName is empty here.
config:
  log:
    level: info
    format: text
  host:
    sysfs: /host/sys
    procfs: /host/proc
  monitor:
    interval: 5s
    staleness: 500ms
  exporter:
    prometheus:
      enabled: true
      debugCollectors:
        - go

serviceMonitor:
  enabled: false
  interval: 5s
  path: /metrics
  labels:
    release: monitoring
  annotations: {}

networkPolicy:
  enabled: false