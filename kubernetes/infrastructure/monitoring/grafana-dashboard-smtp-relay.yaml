            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        }
      ],
      "refresh": "1m",
      "schemaVersion": 39,
      "tags": [
        "smtp",
        "mail"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "SMTP Relay",
      "uid": "smtp-relay",
      "version": 1,
      "weekStart": ""
    }
