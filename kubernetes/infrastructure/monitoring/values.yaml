---
fullnameOverride: kube-prometheus

prometheus:
  prometheusSpec:
    retention: 2d
    retentionSize: 15GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    thanos:
      image: quay.io/thanos/thanos:v0.37.2@sha256:0f72bcecb5c8d7f53634385696179a3da95df97584d583c5385205cf47340487
      objectStorageConfig:
        existingSecret:
          name: thanos-objstore-secret
          key: objstore.yml
      resources:
        requests:
          cpu: 5m
          memory: 176Mi
        limits:
          memory: 352Mi

    resources:
      requests:
        cpu: 180m
        memory: 3072Mi
      limits:
        memory: 6144Mi

    containers:
      - name: prometheus
        env:
          - name: GOMEMLIMIT
            value: 5120MiB

    additionalScrapeConfigs:
      - job_name: "catus-locatus-backend"
        static_configs:
          - targets:
              - "catus-locatus-svc.catus-locatus.svc.cluster.local:4001"
        metrics_path: /api/metrics
        scrape_interval: 10s
      - job_name: "pihole"
        static_configs:
          - targets:
              - "pihole-metrics.pihole.svc.cluster.local:9617"
        metrics_path: /metrics
        scrape_interval: 30s

grafana:
  enabled: true
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: Asia/Riyadh

  # Required; otherwise the chart re-randomizes the admin password on every render.
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

  # RWO Longhorn PVC: Recreate avoids Multi-Attach deadlock.
  deploymentStrategy:
    type: Recreate

  # The chart ignores "extraEnvFrom"; this is the supported key.
  envFromSecrets:
    - name: grafana-discord-webhook
    - name: grafana-github-token

  plugins:
    - grafana-github-datasource

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: infrastructure
          orgId: 1
          folder: Infrastructure
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/infrastructure
  dashboards:
    infrastructure:
      cert-manager:
        gnetId: 20340
        revision: 1
        datasource: Prometheus
      cloudnative-pg:
        gnetId: 20417
        revision: 4
        datasource: Prometheus
      external-dns:
        gnetId: 23969
        revision: 1
        datasource: Prometheus
      metallb:
        gnetId: 20162
        revision: 6
        datasource: Prometheus
      longhorn:
        gnetId: 16888
        revision: 14
        datasource: Prometheus
      argocd:
        url: https://raw.githubusercontent.com/argoproj/argo-cd/master/examples/dashboard.json
      thanos-compact:
        url: https://raw.githubusercontent.com/thanos-io/thanos/v0.37.2/examples/dashboards/compact.json
      thanos-query:
        url: https://raw.githubusercontent.com/thanos-io/thanos/v0.37.2/examples/dashboards/query.json
      thanos-store:
        url: https://raw.githubusercontent.com/thanos-io/thanos/v0.37.2/examples/dashboards/store.json

  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi

  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 1760Mi

  grafana.ini:
    server:
      root_url: https://grafana.alialjaffer.com
      enable_pprof: true
    database:
      wal: true
    smtp:
      enabled: true
      host: smtp-relay.mail.svc.cluster.local:587
      from_address: homelab@alialjaffer.com
      from_name: Grafana
      startTLS_policy: NoStartTLS

  sidecar:
    datasources:
      isDefaultDatasource: false
      defaultDatasourceEnabled: false
    resources:
      requests:
        cpu: 25m
        memory: 136Mi
      limits:
        memory: 272Mi

  additionalDataSources:
    - name: Thanos
      type: prometheus
      uid: thanos
      url: http://thanos-query.monitoring.svc.cluster.local:9090
      access: proxy
      isDefault: true
      jsonData:
        httpMethod: POST
        timeInterval: 15s
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
      jsonData:
        maxLines: 1000
        lokiVersion: 3
        derivedFields:
          - name: traceID
            matcherRegex: traceID=(\w+)
            url: $${__value.raw}
            datasourceUid: prometheus
          - name: spanID
            matcherRegex: spanID=(\w+)
            url: $${__value.raw}
            datasourceUid: prometheus
    - name: Prometheus
      type: prometheus
      uid: prometheus
      url: http://thanos-query.monitoring.svc.cluster.local:9090
      access: proxy
      isDefault: false
      jsonData:
        httpMethod: POST
        timeInterval: 15s
    - name: GitHub
      type: grafana-github-datasource
      uid: github
      access: proxy
      isDefault: false
      editable: false
      jsonData:
        selectedAuthType: personal-access-token
      secureJsonData:
        accessToken: "${GITHUB_TOKEN}"

  deleteDatasources:
    - name: GitHub
      orgId: 1

  alerting:
    contactpoints.yaml:
      apiVersion: 1
      contactPoints:
        - orgId: 1
          name: Discord + Email
          receivers:
            - uid: ff3iaps1ewgzkb
              type: discord
              settings:
                message: '{{ "{{" }} template "discord.default.message" . {{ "}}" }}'
                url: "${DISCORD_WEBHOOK_URL}"
                use_discord_username: false
              disableResolveMessage: false
            - uid: homelab-email-01
              type: email
              settings:
                addresses: ahjfr@icloud.com
                singleEmail: true
              disableResolveMessage: false
    policies.yaml:
      apiVersion: 1
      policies:
        - orgId: 1
          receiver: Discord + Email
          group_by:
            - grafana_folder
            - alertname
    alert-rules.yaml:
      apiVersion: 1
      groups:
        - orgId: 1
          name: Homelab
          folder: Homelab
          interval: 1m
          rules:
            - uid: ff3iazdx48wsgc
              title: CPU Usage > 90%
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: thanos
                  model:
                    expr: '100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)'
                    instant: true
                    refId: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params: [90]
                          type: gt
                        query:
                          params: [C]
                        reducer:
                          type: last
                    expression: A
                    type: threshold
                    refId: C
              noDataState: NoData
              execErrState: Error
              for: 10m
              notification_settings:
                receiver: Discord + Email

            - uid: cf3ib3yooms5ca
              title: High Temperature > 80°C
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: thanos
                  model:
                    expr: 'node_hwmon_temp_celsius{chip="platform_coretemp_0",sensor="temp1"}'
                    instant: true
                    refId: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params: [80]
                          type: gt
                        query:
                          params: [C]
                        reducer:
                          type: last
                    expression: A
                    type: threshold
                    refId: C
              noDataState: NoData
              execErrState: Error
              for: 10m
              notification_settings:
                receiver: Discord + Email

            - uid: ff3ib9gnzeubkc
              title: High Memory Usage > 85%
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: thanos
                  model:
                    expr: '100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))'
                    instant: true
                    refId: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params: [85]
                          type: gt
                        query:
                          params: [C]
                        reducer:
                          type: last
                    expression: A
                    type: threshold
                    refId: C
              noDataState: NoData
              execErrState: Error
              for: 10m
              notification_settings:
                receiver: Discord + Email

            - uid: vgfo0a3aomfu7l
              title: High Node Temperature (any sensor) > 90°C
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: thanos
                  model:
                    expr: 'max by (nodename) (node_hwmon_temp_celsius * on(instance) group_left(nodename) (max by(instance, nodename) (node_uname_info))) or max by (nodename) (node_thermal_zone_temp * on(instance) group_left(nodename) (max by(instance, nodename) (node_uname_info)))'
                    instant: true
                    refId: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params: [90]
                          type: gt
                        query:
                          params: [C]
                        reducer:
                          type: last
                    expression: A
                    type: threshold
                    refId: C
              noDataState: NoData
              execErrState: Error
              for: 10m
              notification_settings:
                receiver: Discord + Email

            - uid: lg7a0af1byfaa
              title: Loki Logs Being Dropped (Alloy)
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: thanos
                  model:
                    expr: 'sum(increase(loki_write_dropped_entries_total[30m]))'
                    instant: true
                    refId: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params: [500]
                          type: gt
                        query:
                          params: [C]
                        reducer:
                          type: last
                    expression: A
                    type: threshold
                    refId: C
              noDataState: NoData
              execErrState: Error
              for: 10m
              notification_settings:
                receiver: Discord + Email

            - uid: lg7a0af1byfbb
              title: Loki Ingest Stalled
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: thanos
                  model:
                    expr: 'sum(increase(loki_distributor_bytes_received_total[15m]))'
                    instant: true
                    refId: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params: [1000]
                          type: lt
                        query:
                          params: [C]
                        reducer:
                          type: last
                    expression: A
                    type: threshold
                    refId: C
              noDataState: Alerting
              execErrState: Error
              for: 10m
              notification_settings:
                receiver: Discord + Email

            - uid: lg7a0af1byfcc
              title: Loki Canary Missing Entries
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: thanos
                  model:
                    expr: 'increase(loki_canary_missing_entries_total[15m])'
                    instant: true
                    refId: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params: [0]
                          type: gt
                        query:
                          params: [C]
                        reducer:
                          type: last
                    expression: A
                    type: threshold
                    refId: C
              noDataState: NoData
              execErrState: Error
              for: 5m
              notification_settings:
                receiver: Discord + Email

            - uid: lg7a0af1byfdd
              title: Loki Canary Query Failures
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: thanos
                  model:
                    expr: 'sum(increase(loki_canary_cache_test_query_results_total{status="failure"}[30m]))'
                    instant: true
                    refId: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params: [3]
                          type: gt
                        query:
                          params: [C]
                        reducer:
                          type: last
                    expression: A
                    type: threshold
                    refId: C
              noDataState: NoData
              execErrState: Error
              for: 5m
              notification_settings:
                receiver: Discord + Email

            - uid: th7a0af1byfaa
              title: Thanos Bucket Uploads Stalled
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: thanos
                  model:
                    expr: 'sum(increase(thanos_bucket_store_block_loads_total[6h]))'
                    instant: true
                    refId: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params: [1]
                          type: lt
                        query:
                          params: [C]
                        reducer:
                          type: last
                    expression: A
                    type: threshold
                    refId: C
              noDataState: NoData
              execErrState: Error
              for: 30m
              notification_settings:
                receiver: Discord + Email

            - uid: th7a0af1byfbb
              title: Thanos Bucket Access Failing
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 900
                    to: 0
                  datasourceUid: thanos
                  model:
                    expr: 'sum(increase(thanos_blocks_meta_sync_failures_total[15m])) + sum(increase(thanos_objstore_bucket_operation_failures_total[15m]))'
                    instant: true
                    refId: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params: [1]
                          type: gt
                        query:
                          params: [C]
                        reducer:
                          type: last
                    expression: A
                    type: threshold
                    refId: C
              noDataState: NoData
              execErrState: Error
              for: 15m
              notification_settings:
                receiver: Discord + Email

kubelet:
  serviceMonitor:
    cAdvisorMetricRelabelings:
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)'
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)'
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_memory_(mapped_file|swap)'
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_(file_descriptors|tasks_state|threads_max)'
      - sourceLabels: [__name__, scope]
        action: drop
        regex: 'container_memory_failures_total;hierarchy'
      - sourceLabels: [__name__, interface]
        action: drop
        regex: 'container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*'
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_spec.*'
      - sourceLabels: [id, pod]
        action: drop
        regex: '.+;'
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_blkio_device_usage_total|container_memory_failures_total'
    probesMetricRelabelings:
      - sourceLabels: [__name__]
        action: drop
        regex: 'prober_probe_duration_seconds_bucket'
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__, le]
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
      - action: drop
        sourceLabels: [__name__]
        regex: 'kubernetes_feature_enabled|prober_probe_duration_seconds_bucket'

kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      - sourceLabels: [__name__]
        regex: 'apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_cache_read_wait_seconds_bucket|apiserver_watch_events_sizes_bucket|apiserver_request_duration_seconds_bucket|apiserver_watch_list_duration_seconds_bucket|etcd_request_duration_seconds_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_admission_controller_admission_duration_seconds_bucket|kubernetes_feature_enabled'
        action: drop

kubeControllerManager:
  serviceMonitor:
    metricRelabelings:
      - sourceLabels: [__name__]
        regex: 'kubernetes_feature_enabled'
        action: drop

kubeScheduler:
  serviceMonitor:
    metricRelabelings:
      - sourceLabels: [__name__]
        regex: 'kubernetes_feature_enabled'
        action: drop

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 5m
        memory: 56Mi
      limits:
        memory: 112Mi
    secrets:
      - grafana-discord-webhook
    # Without this the operator falls back to a null route and drops every alert.
    configSecret: alertmanager-kube-prometheus-alertmanager
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: 'smtp-relay.mail.svc.cluster.local:587'
      smtp_from: 'homelab@alialjaffer.com'
      smtp_require_tls: false
    inhibit_rules:
      - source_matchers:
          - 'severity = critical'
        target_matchers:
          - 'severity =~ warning|info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'severity = warning'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'alertname = InfoInhibitor'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
      - target_matchers:
          - 'alertname = InfoInhibitor'
    route:
      group_by: ['namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'discord'
      routes:
        - receiver: 'null'
          matchers:
            - alertname =~ "InfoInhibitor|Watchdog"
        - receiver: 'email'
          matchers:
            - alertname != "Watchdog"
          continue: true
        - receiver: 'discord'
          matchers:
            - alertname =~ ".+"
    receivers:
      - name: 'discord'
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/grafana-discord-webhook/DISCORD_WEBHOOK_URL
            title: '{{ .GroupLabels.alertname }} {{ if eq .Status "firing" }}[FIRING]{{ else }}[RESOLVED]{{ end }}'
            message: '{{ range .Alerts }}{{ .Annotations.summary }} (severity={{ .Labels.severity }}){{ end }}'
      - name: 'email'
        email_configs:
          - to: 'ahjfr@icloud.com'
            send_resolved: true
      - name: 'null'

# Cilium replaces kube-proxy, so the chart's KubeProxyDown rule would never resolve.
kubeProxy:
  enabled: false

nodeExporter:
  enabled: true

prometheus-node-exporter:
  prometheus:
    monitor:
      metricRelabelings:
        - sourceLabels: [__name__]
          action: drop
          regex: 'node_nfs_requests_total|node_scrape_collector_(duration_seconds|success)|node_network_(address_assign_type|carrier_changes_total|carrier_up_changes_total|carrier_down_changes_total|info|iface_link|iface_id|flags)'
  resources:
    requests:
      cpu: 10m
      memory: 40Mi
    limits:
      memory: 80Mi

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  metricDenylist:
    - ^kube_pod_tolerations$
    - ^kube_pod_status_qos_class$
    - ^kube_pod_status_scheduled$
  resources:
    requests:
      cpu: 25m
      memory: 104Mi
    limits:
      memory: 208Mi

prometheusOperator:
  enabled: true
  resources:
    requests:
      cpu: 5m
      memory: 48Mi
    limits:
      memory: 96Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 5m
        memory: 24Mi
      limits:
        memory: 48Mi
