---
# kube-prometheus-stack values
# Long-term metrics: Prometheus keeps 2 days locally, Thanos sidecar uploads to GCS (forever)
# Grafana data survives pod restarts on a Longhorn PVC

fullnameOverride: kube-prometheus

# --- Prometheus ---
prometheus:
  prometheusSpec:
    # Short local retention  -  historical data lives in Thanos/MinIO
    retention: 2d
    retentionSize: 15GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    # Thanos sidecar  -  uploads TSDB blocks to MinIO continuously
    thanos:
      image: quay.io/thanos/thanos:v0.37.2
      objectStorageConfig:
        existingSecret:
          name: thanos-objstore-secret   # SealedSecret: see bootstrap/README.md Step 6
          key: objstore.yml
      # ThanosSpec.resources - passed straight through to the Prometheus CR,
      # not a chart-templated field, so it's absent from `helm show values`.
      resources:
        requests:
          cpu: 5m
          memory: 176Mi
        limits:
          cpu: 20m
          memory: 352Mi

    resources:
      requests:
        cpu: 180m
        memory: 3816Mi
      limits:
        cpu: 540m
        memory: 7632Mi

    # Scrape all pods with prometheus.io/scrape=true
    additionalScrapeConfigs:
      - job_name: "catus-locatus-backend"
        static_configs:
          - targets:
              - "catus-locatus-svc.catus-locatus.svc.cluster.local:4001"
        metrics_path: /api/metrics
        scrape_interval: 10s
      - job_name: "pihole"
        static_configs:
          - targets:
              - "pihole-metrics.pihole.svc.cluster.local:9617"
        metrics_path: /metrics
        scrape_interval: 30s

# --- Grafana ---
grafana:
  enabled: true
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: Asia/Riyadh

  # Static admin credentials via a self-managed SealedSecret. Without this,
  # the chart auto-generates a random admin password on every render using
  # Helm's `lookup` function to try to reuse the existing one - but ArgoCD's
  # repo-server renders Helm charts without reliable live-cluster access, so
  # `lookup` intermittently returns nothing and the password gets randomized
  # again, silently invalidating whatever's actually set on the running
  # Grafana instance (it only reads the password at first DB init).
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

  # RWO Longhorn PVC: Recreate avoids Multi-Attach deadlock on rollouts
  deploymentStrategy:
    type: Recreate

  # NOTE: "extraEnvFrom" is not a field this chart recognizes (silently
  # ignored) - the correct key is envFromSecrets. Confirmed against
  # charts/grafana/templates/_pod.tpl for chart 12.10.4.
  envFromSecrets:
    - name: grafana-discord-webhook
    - name: grafana-github-token

  # user/password injected as GF_SMTP_USER / GF_SMTP_PASSWORD from the secret
  smtp:
    existingSecret: grafana-smtp-secret

  plugins:
    - grafana-github-datasource

  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi

  resources:
    requests:
      cpu: 50m
      memory: 880Mi
    limits:
      cpu: 150m
      memory: 1760Mi

  grafana.ini:
    server:
      root_url: https://grafana.alialjaffer.com
    database:
      wal: true  # required for SQLite on networked (Longhorn) storage
    smtp:
      enabled: true
      host: email-smtp.us-east-1.amazonaws.com:587
      from_address: homelab@alialjaffer.com
      from_name: Grafana
      startTLS_policy: MandatoryStartTLS

  # sidecar.resources is shared by both grafana-sc-dashboard and
  # grafana-sc-datasources (chart has one resources key for all k8s-sidecar
  # containers, no per-type override) - sized to the larger of the two
  # observed.
  sidecar:
    datasources:
      isDefaultDatasource: false
      defaultDatasourceEnabled: false
    resources:
      requests:
        cpu: 25m
        memory: 136Mi
      limits:
        cpu: 75m
        memory: 272Mi

  # Point Grafana at Thanos Query for long-term metrics
  additionalDataSources:
    - name: Thanos
      type: prometheus
      uid: thanos
      url: http://thanos-query.monitoring.svc.cluster.local:9090
      access: proxy
      isDefault: true
      jsonData:
        httpMethod: POST
        timeInterval: 15s
    - name: Loki
      type: loki
      url: http://loki-gateway.monitoring.svc.cluster.local
      access: proxy
      isDefault: false
      jsonData:
        maxLines: 1000
        lokiVersion: 3
        derivedFields:
          - name: traceID
            matcherRegex: traceID=(\w+)
            url: $${__value.raw}
            datasourceUid: prometheus
          - name: spanID
            matcherRegex: spanID=(\w+)
            url: $${__value.raw}
            datasourceUid: prometheus
    # Alias so dashboards that hardcode a "prometheus" name/uid resolve.
    # Points at Thanos Query (not raw Prometheus) for full retention.
    - name: Prometheus
      type: prometheus
      uid: prometheus
      url: http://thanos-query.monitoring.svc.cluster.local:9090
      access: proxy
      isDefault: false
      jsonData:
        httpMethod: POST
        timeInterval: 15s
    # Re-added (see below and grafana.deleteDatasources). The earlier
    # "Datasource provisioning error: data source not found" was never fatal
    # to the pod - it was a name collision: an earlier attempt at this same
    # datasource left a "GitHub" row in Grafana's DB with an auto-generated
    # uid, and re-provisioning a differently-uid'd datasource with the same
    # name can't reconcile against it. grafana.deleteDatasources clears that
    # row before recreating it.
    - name: GitHub
      type: grafana-github-datasource
      uid: github
      access: proxy
      isDefault: false
      editable: false
      jsonData:
        selectedAuthType: personal-access-token
      secureJsonData:
        accessToken: "${GITHUB_TOKEN}"  # Set via grafana.envFromSecrets

  # Clears the stale auto-uid "GitHub" row before additionalDataSources
  # recreates it with uid: github (see comment above).
  deleteDatasources:
    - name: GitHub
      orgId: 1

  # Alerting provisioning (migrated from grafana-alerting-configmap.yaml)
  alerting:
    contactpoints.yaml:
      apiVersion: 1
      contactPoints:
        - orgId: 1
          name: Discord Channel
          receivers:
            - uid: ff3iaps1ewgzkb
              type: discord
              settings:
                message: '{{ "{{" }} template "discord.default.message" . {{ "}}" }}'
                url: "${DISCORD_WEBHOOK_URL}"  # Set via grafana.envFromSecret
                use_discord_username: false
              disableResolveMessage: false
    policies.yaml:
      apiVersion: 1
      policies:
        - orgId: 1
          receiver: Discord Channel
          group_by:
            - grafana_folder
            - alertname
    alert-rules.yaml:
      apiVersion: 1
      groups:
        - orgId: 1
          name: Homelab
          folder: Homelab
          interval: 1m
          rules:
            - uid: ff3iazdx48wsgc
              title: CPU Usage > 90%
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: thanos
                  model:
                    expr: '100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)'
                    instant: true
                    refId: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params: [90]
                          type: gt
                        query:
                          params: [C]
                        reducer:
                          type: last
                    expression: A
                    type: threshold
                    refId: C
              noDataState: NoData
              execErrState: Error
              for: 10m
              notification_settings:
                receiver: Discord Channel

            - uid: cf3ib3yooms5ca
              title: High Temperature > 80°C
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: thanos
                  model:
                    expr: 'node_hwmon_temp_celsius{chip="platform_coretemp_0",sensor="temp1"}'
                    instant: true
                    refId: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params: [80]
                          type: gt
                        query:
                          params: [C]
                        reducer:
                          type: last
                    expression: A
                    type: threshold
                    refId: C
              noDataState: NoData
              execErrState: Error
              for: 10m
              notification_settings:
                receiver: Discord Channel

            - uid: ff3ib9gnzeubkc
              title: High Memory Usage > 70%
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: thanos
                  model:
                    expr: '100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))'
                    instant: true
                    refId: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params: [70]
                          type: gt
                        query:
                          params: [C]
                        reducer:
                          type: last
                    expression: A
                    type: threshold
                    refId: C
              noDataState: NoData
              execErrState: Error
              for: 10m
              notification_settings:
                receiver: Discord Channel

# --- Apiserver scrape: drop high-cardinality histograms with no homelab value ---
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      - sourceLabels: [__name__]
        regex: 'apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_cache_read_wait_seconds_bucket|apiserver_watch_events_sizes_bucket'
        action: drop

# --- AlertManager ---
alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 5m
        memory: 56Mi
      limits:
        cpu: 20m
        memory: 112Mi

# --- Node Exporter ---
nodeExporter:
  enabled: true

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 40Mi
    limits:
      cpu: 30m
      memory: 80Mi

# --- kube-state-metrics ---
kubeStateMetrics:
  enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 104Mi
    limits:
      cpu: 75m
      memory: 208Mi

# --- Prometheus Operator ---
prometheusOperator:
  enabled: true
  resources:
    requests:
      cpu: 5m
      memory: 48Mi
    limits:
      cpu: 20m
      memory: 96Mi
  # Shared setting: also sizes the config-reloader sidecar injected into the
  # Alertmanager StatefulSet, not just Prometheus's.
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 5m
        memory: 24Mi
      limits:
        cpu: 20m
        memory: 48Mi
