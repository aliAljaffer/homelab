# Default-deny + explicit-allow for the monitoring namespace.
# Matrix source: CONTEXT-networkpolicy-audit.md, extended after live inspection
# (see notes below for what changed from the original audit doc).
#
# NOT yet wired into kustomization.yaml. This is the highest fan-in/fan-out
# namespace in the cluster - per the audit doc's rollout plan, apply this
# LAST, only after audit mode has been observed clean on the simpler
# namespaces for at least a full day (catches daily cronjobs, backup cycles,
# gravity/adlist updates, etc).
#
# Corrections vs. the original audit doc:
# - Thanos (sidecar in the prometheus pod, storegateway, compactor) and Loki
#   do NOT talk to catus-locatus's MinIO. kubernetes/bootstrap/README.md's
#   Step 6 example is stale. Both actually use GCS (bucket
#   alialjaffer-homelab, shared with Velero) - confirmed from the live
#   thanos-objstore-secret and loki/values.yaml. Egress below is to
#   storage.googleapis.com / oauth2.googleapis.com, not an in-cluster MinIO.
# - CoreDNS (kube-system, port 9153) is scraped by the default
#   kube-prometheus-coredns ServiceMonitor - wasn't in the original matrix.
# - kube-controller-manager, kube-scheduler, kube-etcd, kube-proxy
#   ServiceMonitors exist but have no live Endpoints on this Talos cluster
#   (checked: all NotFound) - no egress needed for them.
# - kubelet/cAdvisor (kube-prometheus-kubelet ServiceMonitor) scrapes node
#   IPs directly on :10250, not a pod - modeled as Cilium host/remote-node
#   entities, not a namespace selector.
# - argocd and cert-manager ports (not spelled out as numbers in the
#   original doc) were read directly off their metrics Services.
#
# Assumption not verified live: GitHub API egress for grafana-github-datasource
# is assumed to be api.github.com:443 (standard for that plugin) - confirm
# via audit-mode logs if the datasource is actually exercised.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus-default
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      operator.prometheus.io/name: kube-prometheus-prometheus
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - kube-apiserver
    # kubelet/cAdvisor scrape (kube-prometheus-kubelet ServiceMonitor).
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
    # Send firing alerts to Alertmanager (Prometheus CR spec.alerting).
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: alertmanager
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
    # Thanos sidecar (same pod): upload TSDB blocks to GCS.
    - toFQDNs:
        - matchName: "storage.googleapis.com"
        - matchName: "oauth2.googleapis.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": cnpg-system
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": longhorn-system
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": metallb-system
      toPorts:
        - ports:
            - port: "9120"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kyverno
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": external-dns
      toPorts:
        - ports:
            - port: "7979"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": velero
      toPorts:
        - ports:
            - port: "8085"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kepler
      toPorts:
        - ports:
            - port: "28282"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": cloudflare-tunnel-system
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": arc-systems
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": keycloak
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": catus-locatus
      toPorts:
        - ports:
            - port: "4001"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": pihole
      toPorts:
        - ports:
            - port: "9617"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "9153"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": argocd
      toPorts:
        - ports:
            - port: "8082"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "9001"
              protocol: TCP
            - port: "8084"
              protocol: TCP
            - port: "8083"
              protocol: TCP
            - port: "9121"
              protocol: TCP
            - port: "5558"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": cert-manager
      toPorts:
        - ports:
            - port: "9402"
              protocol: TCP
---
