apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-default
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  ingress:
    # monitoring-grafana Service is 80 -> targetPort "grafana" (container port
    # 3000). Cilium enforces on the post-DNAT (real) port, confirmed via
    # Hubble: the tunnel proxy's actual flow lands on :3000, not :80.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": cloudflare-tunnel-system
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # kubelet liveness/readiness probe (httpGet :3000 /api/health).
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: thanos
            app.kubernetes.io/component: query
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: loki
            app.kubernetes.io/component: gateway
      toPorts:
        - ports:
            # loki-gateway Service is 80 -> targetPort http-metrics (8080);
            # Cilium enforces the post-DNAT port.
            - port: "8080"
              protocol: TCP
    # SES SMTP for alert/invite emails (grafana.ini smtp.host).
    - toFQDNs:
        - matchName: "email-smtp.us-east-1.amazonaws.com"
      toPorts:
        - ports:
            - port: "587"
              protocol: TCP
    # grafana-github-datasource plugin.
    - toFQDNs:
        - matchName: "api.github.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Discord contact point (grafana-discord-webhook).
    - toFQDNs:
        - matchName: "discord.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: loki-gateway-default
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/component: gateway
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana
        - matchLabels:
            app.kubernetes.io/name: alloy
        - matchLabels:
            app.kubernetes.io/name: loki
            app.kubernetes.io/component: canary
      toPorts:
        - ports:
            # loki-gateway Service is 80 -> targetPort http-metrics (8080);
            # Cilium enforces the post-DNAT port.
            - port: "8080"
              protocol: TCP
    # kubelet readiness probe (httpGet :8080 /).
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: loki
            app.kubernetes.io/component: single-binary
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
---
