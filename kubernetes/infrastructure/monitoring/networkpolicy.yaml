# Selectors need the k8s:io.kubernetes.pod.namespace label to cross namespaces.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus-default
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      operator.prometheus.io/name: kube-prometheus-prometheus
  egress:
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
      rules:
        dns:
        - matchPattern: "*"
  - toEntities:
    - kube-apiserver
  - toEntities:
    - host
    - remote-node
    toPorts:
    - ports:
      - port: "10250"
        protocol: TCP
      - port: "9100"
        protocol: TCP
  - toEntities:
    - host
    - remote-node
    toPorts:
    - ports:
      - port: "9100"
        protocol: TCP
      - port: "9120"
        protocol: TCP
      - port: "9140"
        protocol: TCP
      - port: "9141"
        protocol: TCP
      - port: "9962"
        protocol: TCP
      - port: "9963"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: alertmanager
    toPorts:
    - ports:
      - port: "9093"
        protocol: TCP
  # toFQDNs does not work for GCS through Cilium's DNS proxy; keep these CIDR rules.
  - toFQDNs:
    - matchName: "storage.googleapis.com"
    - matchName: "oauth2.googleapis.com"
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": cnpg-system
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": longhorn-system
    toPorts:
    - ports:
      - port: "9500"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": metallb-system
    toPorts:
    - ports:
      - port: "9120"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": external-dns
    toPorts:
    - ports:
      - port: "7979"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": kepler
    toPorts:
    - ports:
      - port: "28282"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": cloudflare-tunnel-system
    toPorts:
    - ports:
      - port: "8081"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": arc-systems
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP

  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": catus-locatus
    toPorts:
    - ports:
      - port: "4001"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": pihole
    toPorts:
    - ports:
      - port: "9617"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: alloy
    toPorts:
    - ports:
      - port: "12345"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/component: single-binary
    toPorts:
    - ports:
      - port: "3100"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/component: canary
    toPorts:
    - ports:
      - port: "3500"
        protocol: TCP
  - toEndpoints:
    - matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
        - memcached-chunks-cache
        - memcached-results-cache
    toPorts:
    - ports:
      - port: "9150"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "9153"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": argocd
    toPorts:
    - ports:
      - port: "8082"
        protocol: TCP
      - port: "8080"
        protocol: TCP
      - port: "9001"
        protocol: TCP
      - port: "8084"
        protocol: TCP
      - port: "8083"
        protocol: TCP
      - port: "9121"
        protocol: TCP
      - port: "5558"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": cert-manager
    toPorts:
    - ports:
      - port: "9402"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: thanos
    toPorts:
    - ports:
      - port: "9090"
        protocol: TCP
      - port: "10902"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: kube-state-metrics
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator
    toPorts:
    - ports:
      - port: "10250"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": cloudflare-tunnel-system
        app.kubernetes.io/name: cloudflare-tunnel-gateway-controller
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: alertmanager
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": kube-system
        k8s-app: cilium
    toPorts:
    - ports:
      - port: "9962"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": kube-system
        app.kubernetes.io/name: cilium-operator
    toPorts:
    - ports:
      - port: "9963"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": kube-system
        name: sealed-secrets-controller
    toPorts:
    - ports:
      - port: "8081"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": monitoring
        app.kubernetes.io/name: grafana
    toPorts:
    - ports:
      - port: "3000"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": falco
        app.kubernetes.io/name: falco
    toPorts:
    - ports:
      - port: "8765"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": falco
        app.kubernetes.io/name: falcosidekick
    toPorts:
    - ports:
      - port: "2801"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": umami
        cnpg.io/cluster: umami-db
    toPorts:
    - ports:
      - port: "9187"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": catus-locatus
        cnpg.io/cluster: catus-locatus-db
    toPorts:
    - ports:
      - port: "9187"
        protocol: TCP
---
