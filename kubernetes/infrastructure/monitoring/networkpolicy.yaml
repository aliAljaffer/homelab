apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: loki-cache-default
  namespace: monitoring
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - memcached-chunks-cache
          - memcached-results-cache
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: loki
            app.kubernetes.io/component: single-binary
      toPorts:
        - ports:
            - port: "11211"
              protocol: TCP
    # kubelet liveness/readiness probes: memcached tcpSocket :11211,
    # exporter httpGet :9150 /metrics.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "11211"
              protocol: TCP
            - port: "9150"
              protocol: TCP
---
