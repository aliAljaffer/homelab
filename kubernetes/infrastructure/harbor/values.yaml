# Harbor as a LAN pull-through cache for docker.io, ghcr.io, quay.io and
# registry.k8s.io. TLS is terminated by homelab-gateway; Harbor itself speaks
# HTTP inside the cluster.
expose:
  type: clusterIP
  tls:
    enabled: false
  clusterIP:
    name: harbor
    ports:
      httpPort: 80

externalURL: https://harbor.alialjaffer.com

# All component secrets are SealedSecrets; the chart must not generate random
# values (ArgoCD's Helm render has no lookup, so randAlphaNum drifts on every
# sync).
existingSecretAdminPassword: harbor-admin
existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
existingSecretSecretKey: harbor-global

core:
  existingSecret: harbor-core-app
  existingXsrfSecret: harbor-core-app
  existingXsrfSecretKey: CSRF_KEY
  # Token-service signing cert; without this the chart calls genCA on every
  # render and the certificate churns.
  secretName: harbor-core-tls

jobservice:
  existingSecret: harbor-jobservice-app
  existingSecretKey: JOBSERVICE_SECRET

registry:
  existingSecret: harbor-registry-app
  existingSecretKey: REGISTRY_HTTP_SECRET
  credentials:
    # The chart otherwise calls htpasswd() with a random salt on every render,
    # which makes ArgoCD flap on the registry-htpasswd Secret.
    password: harbor_registry_password
    htpasswdString: "harbor_registry_user:$2b$10$y/KFS8pwVtaRx0Wg1f6c1uBPRqnER10bWb/cwqjTTM.0lWqXTZtPa"

# Cache only; losing the volume just means re-pulling. Longhorn keeps it.
persistence:
  enabled: true
  persistentVolumeClaim:
    registry:
      storageClass: longhorn
      size: 50Gi
    jobservice:
      jobLog:
        storageClass: longhorn
        size: 1Gi
    database:
      storageClass: longhorn
      size: 5Gi

database:
  type: internal
redis:
  type: external
  external:
    addr: valkey.redis-operator.svc.cluster.local:6379
    coreDatabaseIndex: "0"
    jobserviceDatabaseIndex: "1"
    registryDatabaseIndex: "2"
    trivyAdapterIndex: "5"
    password: ""

# Not a security scanner box; disable Trivy for now.
trivy:
  enabled: false
