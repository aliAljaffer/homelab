# ArgoCD's Helm render has no lookup: every generated secret/cert must be sealed, or it churns on each sync.

expose:
  type: clusterIP
  tls:
    enabled: false
  clusterIP:
    name: harbor
    ports:
      httpPort: 80

externalURL: https://harbor.alialjaffer.com

existingSecretAdminPassword: harbor-admin
existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
existingSecretSecretKey: harbor-global

core:
  existingSecret: harbor-core-app
  existingXsrfSecret: harbor-core-app
  existingXsrfSecretKey: CSRF_KEY
  secretName: harbor-core-tls

jobservice:
  existingSecret: harbor-jobservice-app
  existingSecretKey: JOBSERVICE_SECRET

registry:
  existingSecret: harbor-registry-app
  existingSecretKey: REGISTRY_HTTP_SECRET
  credentials:
    password: harbor_registry_password
    htpasswdString: "harbor_registry_user:$2b$10$y/KFS8pwVtaRx0Wg1f6c1uBPRqnER10bWb/cwqjTTM.0lWqXTZtPa"

persistence:
  enabled: true
  persistentVolumeClaim:
    registry:
      existingClaim: harbor-registry-rwx
      storageClass: longhorn
      size: 50Gi
    jobservice:
      jobLog:
        storageClass: longhorn
        size: 1Gi
    database:
      storageClass: longhorn
      size: 5Gi

database:
  type: internal
redis:
  type: external
  external:
    addr: valkey.redis-operator.svc.cluster.local:6379
    coreDatabaseIndex: "0"
    jobserviceDatabaseIndex: "1"
    registryDatabaseIndex: "2"
    trivyAdapterIndex: "5"
    password: ""

updateStrategy:
  type: Recreate

trivy:
  enabled: false
