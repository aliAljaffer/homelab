---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault
  namespace: vault
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - vault.alialjaffer.com
  rules:
    - backendRefs:
        - name: vault
          port: 8200
