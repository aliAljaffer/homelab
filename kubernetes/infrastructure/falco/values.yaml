driver:
  kind: modern_ebpf
  modernEbpf:
    leastPrivileged: true

falco:
  json_output: true
  webserver:
    prometheus_metrics_enabled: true

customRules:
  falco_rules.local.yaml: |-
    # The container plugin tags host container-runtime processes (CNI plugins,
    # the sysctl init) with container.id="runtime". Those are not workload
    # containers, so "binary not part of base image" must not fire for them.
    - rule: Drop and execute new binary in container
      condition: and not (container.id = runtime)
      override:
        condition: append

    # pihole rewrites pihole-FTL in place, which tripped the same rule.
    - list: known_drop_and_execute_containers
      items: ['docker.io/pihole/pihole']
      override:
        items: append

metrics:
  enabled: true

serviceMonitor:
  create: true
  labels:
    release: monitoring

grafana:
  dashboards:
    enabled: true
    configMaps:
      falco:
        namespace: monitoring
        folder: Falco

falcosidekick:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: monitoring
  grafana:
    dashboards:
      enabled: true
      configMaps:
        falcosidekick:
          namespace: monitoring
          folder: Falco
  config:
    smtp:
      hostport: "smtp-relay.mail.svc.cluster.local:587"
      tls: false
      from: "homelab@alialjaffer.com"
      to: "ahjfr@icloud.com"
      minimumpriority: "warning"
