driver:
  kind: modern_ebpf
  modernEbpf:
    leastPrivileged: true

falco:
  json_output: true
  webserver:
    prometheus_metrics_enabled: true

# Local rule overrides, loaded after the upstream ruleset (the chart mounts this
# under /etc/falco/rules.d, which rules_files loads last). Without these,
# "Drop and execute new binary in container" (CRITICAL) fires on every pod start
# and floods the falcosidekick SMTP output.
customRules:
  falco_rules.local.yaml: |-
    # The container plugin tags host container-runtime processes (CNI plugins,
    # the sysctl init) with container.id="runtime". Those are not workload
    # containers, so "binary not part of base image" must not fire for them.
    - rule: Drop and execute new binary in container
      condition: and not (container.id = runtime)
      override:
        condition: append

    # pihole rewrites pihole-FTL in place, which tripped the same rule.
    - list: known_drop_and_execute_containers
      items: ['docker.io/pihole/pihole']
      override:
        items: append

# Falco's own engine-health metrics (event/drop counts, CPU/RSS, rule matches),
# separate from serviceMonitor and falcosidekick's metrics below.
metrics:
  enabled: true

serviceMonitor:
  create: true
  labels:
    release: monitoring

# Dashboard ConfigMap lives in monitoring namespace (like other components) so Grafana's sidecar picks it up.
grafana:
  dashboards:
    enabled: true
    configMaps:
      falco:
        namespace: monitoring
        folder: Falco

# Routes Falco alerts to outputs and exposes its own alert-volume/delivery metrics.
falcosidekick:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: monitoring
  grafana:
    dashboards:
      enabled: true
      configMaps:
        falcosidekick:
          namespace: monitoring
          folder: Falco
  # Email Falco runtime-security events via Resend SMTP. Non-secret fields go in
  # the chart-managed config secret; the API key is injected as SMTP_PASSWORD
  # from the falcosidekick-smtp-secret SealedSecret.
  config:
    smtp:
      hostport: "smtp.resend.com:587"
      tls: true
      user: "resend"
      from: "homelab@alialjaffer.com"
      to: "ahjfr@icloud.com"
      minimumpriority: "warning"
    extraEnv:
      - name: SMTP_PASSWORD
        valueFrom:
          secretKeyRef:
            name: falcosidekick-smtp-secret
            key: password
