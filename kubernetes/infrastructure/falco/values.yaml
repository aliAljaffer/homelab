driver:
  kind: modern_ebpf
  modernEbpf:
    # Runs with BPF/SYS_RESOURCE/PERFMON/SYS_PTRACE instead of a fully privileged container.
    leastPrivileged: true

falco:
  json_output: true
  webserver:
    prometheus_metrics_enabled: true

# Falco's own engine-health metrics (event/drop counts, CPU/RSS, rule matches),
# separate from serviceMonitor and falcosidekick's metrics below.
metrics:
  enabled: true

# release: monitoring label matches Prometheus's serviceMonitorSelector.
serviceMonitor:
  create: true
  labels:
    release: monitoring

# Dashboard ConfigMap lives in monitoring namespace (like other components) so Grafana's sidecar picks it up.
grafana:
  dashboards:
    enabled: true
    configMaps:
      falco:
        namespace: monitoring
        folder: Falco

# Routes Falco alerts to outputs and exposes its own alert-volume/delivery metrics.
falcosidekick:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: monitoring
  grafana:
    dashboards:
      enabled: true
      configMaps:
        falcosidekick:
          namespace: monitoring
          folder: Falco
