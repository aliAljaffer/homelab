---
crds:
  enabled: true
featureGates: "ExperimentalGatewayAPISupport=true"

resources:
  requests:
    cpu: 5m
    memory: 120Mi
  limits:
    memory: 240Mi

cainjector:
  resources:
    requests:
      cpu: 5m
      memory: 176Mi
    limits:
      memory: 352Mi

webhook:
  resources:
    requests:
      cpu: 5m
      memory: 80Mi
    limits:
      memory: 160Mi

prometheus:
  enabled: true
  servicemonitor:
    enabled: true
    labels:
      release: monitoring
