---
# Recommender only: no updater and no admission controller, so nothing in this
# chart evicts, patches or restarts a pod. The VPA objects it serves are read as
# advice (kubernetes/apps/hermes/vpa.yaml pins updateMode Off).
fullnameOverride: vpa

recommender:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 512Mi
  # Left empty on purpose: with replicaCount 1, any minAvailable blocks drains.
  podDisruptionBudget: {}

updater:
  enabled: false

admissionController:
  enabled: false
