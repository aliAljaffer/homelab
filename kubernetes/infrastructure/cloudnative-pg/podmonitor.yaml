---
# CloudNativePG's Helm chart has no metrics/serviceMonitor toggle (checked
# v0.29.0), and Cluster CRs don't create one either. The operator and every
# Cluster instance pod already expose a "metrics" port on their own, so
# PodMonitors (not ServiceMonitors, there's no backing Service) pick them up.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cloudnative-pg-operator
  namespace: cnpg-system
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  podMetricsEndpoints:
  - port: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cloudnative-pg-clusters
  namespace: cnpg-system
  labels:
    release: monitoring
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: cloudnative-pg
  podMetricsEndpoints:
  - port: metrics
