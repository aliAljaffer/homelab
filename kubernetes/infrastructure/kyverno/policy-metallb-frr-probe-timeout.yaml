apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: metallb-frr-probe-timeout
spec:
  background: false
  rules:
    - name: frr-probe-timeout
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [metallb-system]
      # Autogen must not translate this rule onto Pod controllers: the
      # DaemonSet mutation reorders the container list and ArgoCD diffs
      # containers positionally, so it self-heals forever. Putting an
      # annotation filter in exclude skips autogen; the Pods get mutated
      # at admission time either way.
      exclude:
        any:
          - resources:
              annotations: { "pod-policies.kyverno.io/autogen-controllers": "none" }
      preconditions:
        all:
          - key: "{{ request.object.spec.containers[?name=='frr'] | length(@) }}"
            operator: GreaterThan
            value: 0
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - name: frr
                startupProbe:
                  timeoutSeconds: 5
                livenessProbe:
                  timeoutSeconds: 5
