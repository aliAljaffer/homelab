apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: metallb-frr-probe-timeout
  # autogen turns this into a DaemonSet mutation that reorders the pod
  # template's containers; ArgoCD diffs container lists positionally, so it
  # loops self-healing. Pods still get the mutation at admission time.
  pod-policies.kyverno.io/autogen-controllers: none
spec:
  background: false
  rules:
    - name: frr-probe-timeout
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [metallb-system]
      preconditions:
        all:
          - key: "{{ request.object.spec.containers[?name=='frr'] | length(@) }}"
            operator: GreaterThan
            value: 0
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - name: frr
                startupProbe:
                  timeoutSeconds: 5
                livenessProbe:
                  timeoutSeconds: 5
