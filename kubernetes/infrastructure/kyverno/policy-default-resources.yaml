apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: default-resources-unmanaged-containers
spec:
  background: false
  rules:
    - name: longhorn-csi-attacher
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [longhorn-system]
      preconditions:
        all:
          - key: "{{ request.object.spec.containers[?name=='csi-attacher'] | length(@) }}"
            operator: GreaterThan
            value: 0
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - name: csi-attacher
                resources:
                  requests: { cpu: 5m, memory: 88Mi }
                  limits: { cpu: 20m, memory: 176Mi }

    - name: longhorn-csi-provisioner
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [longhorn-system]
      preconditions:
        all:
          - key: "{{ request.object.spec.containers[?name=='csi-provisioner'] | length(@) }}"
            operator: GreaterThan
            value: 0
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - name: csi-provisioner
                resources:
                  requests: { cpu: 5m, memory: 64Mi }
                  limits: { cpu: 20m, memory: 128Mi }

    - name: longhorn-csi-resizer
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [longhorn-system]
      preconditions:
        all:
          - key: "{{ request.object.spec.containers[?name=='csi-resizer'] | length(@) }}"
            operator: GreaterThan
            value: 0
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - name: csi-resizer
                resources:
                  requests: { cpu: 5m, memory: 80Mi }
                  limits: { cpu: 20m, memory: 160Mi }

    - name: longhorn-csi-snapshotter
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [longhorn-system]
      preconditions:
        all:
          - key: "{{ request.object.spec.containers[?name=='csi-snapshotter'] | length(@) }}"
            operator: GreaterThan
            value: 0
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - name: csi-snapshotter
                resources:
                  requests: { cpu: 5m, memory: 80Mi }
                  limits: { cpu: 20m, memory: 160Mi }

    - name: longhorn-csi-plugin
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [longhorn-system]
      preconditions:
        all:
          - key: "{{ request.object.spec.containers[?name=='longhorn-csi-plugin'] | length(@) }}"
            operator: GreaterThan
            value: 0
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - name: longhorn-csi-plugin
                resources:
                  requests: { cpu: 5m, memory: 72Mi }
                  limits: { cpu: 20m, memory: 144Mi }
              - name: longhorn-liveness-probe
                resources:
                  requests: { cpu: 5m, memory: 40Mi }
                  limits: { cpu: 20m, memory: 80Mi }
              - name: node-driver-registrar
                resources:
                  requests: { cpu: 5m, memory: 16Mi }
                  limits: { cpu: 20m, memory: 32Mi }

    - name: longhorn-driver-deployer
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [longhorn-system]
      preconditions:
        all:
          - key: "{{ request.object.spec.containers[?name=='longhorn-driver-deployer'] | length(@) }}"
            operator: GreaterThan
            value: 0
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - name: longhorn-driver-deployer
                resources:
                  requests: { cpu: 5m, memory: 16Mi }
                  limits: { cpu: 20m, memory: 32Mi }

    - name: longhorn-manager
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [longhorn-system]
      preconditions:
        all:
          - key: "{{ request.object.spec.containers[?name=='pre-pull-share-manager-image'] | length(@) }}"
            operator: GreaterThan
            value: 0
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - name: pre-pull-share-manager-image
                resources:
                  requests: { cpu: 5m, memory: 16Mi }
                  limits: { cpu: 20m, memory: 32Mi }

    - name: longhorn-ui
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [longhorn-system]
      preconditions:
        all:
          - key: "{{ request.object.spec.containers[?name=='longhorn-ui'] | length(@) }}"
            operator: GreaterThan
            value: 0
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - name: longhorn-ui
                resources:
                  requests: { cpu: 5m, memory: 16Mi }
                  limits: { cpu: 20m, memory: 32Mi }

    - name: longhorn-engine-image
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [longhorn-system]
              selector:
                matchLabels:
                  longhorn.io/component: engine-image
      mutate:
        # Container name varies per Longhorn version (engine-image-ei-<hash>), patch by position.
        patchesJson6902: |-
          - op: add
            path: /spec/containers/0/resources
            value:
              requests: { cpu: 25m, memory: 24Mi }
              limits: { cpu: 75m, memory: 48Mi }

    - name: metallb-frr-k8s-statuscleaner
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [metallb-system]
      preconditions:
        all:
          - key: "{{ request.object.spec.containers[?name=='frr-k8s-statuscleaner'] | length(@) }}"
            operator: GreaterThan
            value: 0
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - name: frr-k8s-statuscleaner
                resources:
                  requests: { cpu: 5m, memory: 32Mi }
                  limits: { cpu: 20m, memory: 64Mi }

    - name: loki-chunks-cache-exporter
      # memcached_exporter has no resources key in this chart version, same as the Longhorn rules above.
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [monitoring]
              selector:
                matchLabels:
                  app.kubernetes.io/component: memcached-chunks-cache
      preconditions:
        all:
          - key: "{{ request.object.spec.containers[?name=='exporter'] | length(@) }}"
            operator: GreaterThan
            value: 0
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - name: exporter
                resources:
                  requests: { cpu: 10m, memory: 32Mi }
                  limits: { cpu: 30m, memory: 64Mi }

    - name: loki-results-cache-exporter
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [monitoring]
              selector:
                matchLabels:
                  app.kubernetes.io/component: memcached-results-cache
      preconditions:
        all:
          - key: "{{ request.object.spec.containers[?name=='exporter'] | length(@) }}"
            operator: GreaterThan
            value: 0
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - name: exporter
                resources:
                  requests: { cpu: 5m, memory: 32Mi }
                  limits: { cpu: 20m, memory: 64Mi }

    - name: metrics-server
      # Not GitOps-managed, installed out-of-band during cluster bootstrap. Covered here so it isn't ungoverned.
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [kube-system]
      preconditions:
        all:
          - key: "{{ request.object.spec.containers[?name=='metrics-server'] | length(@) }}"
            operator: GreaterThan
            value: 0
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - name: metrics-server
                resources:
                  requests: { cpu: 10m, memory: 112Mi }
                  limits: { cpu: 30m, memory: 224Mi }
