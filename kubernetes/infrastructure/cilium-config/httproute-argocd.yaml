---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - argocd.alialjaffer.com
  rules:
    - backendRefs:
        - name: argocd-server
          namespace: argocd
          port: 80
