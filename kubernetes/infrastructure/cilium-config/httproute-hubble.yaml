---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - hubble.alialjaffer.com
  rules:
    - backendRefs:
        - name: hubble-ui
          namespace: kube-system
          port: 80
