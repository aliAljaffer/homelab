provider:
  name: cloudflare

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-token
        key: api-key

txtOwnerId: "homelab-talos"

# Watch Gateway API HTTPRoutes instead of legacy Ingress
sources:
  - service
  - gateway-httproute

domainFilters:
  - alialjaffer.com
