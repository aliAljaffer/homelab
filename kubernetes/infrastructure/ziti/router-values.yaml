---
image:
  tag: "2.0.4"

# The chart enrolls from a one-time JWT on first start, then persists its
# identity on the PVC below. The Secret is created by scripts/enroll-router.sh,
# not by Argo, so it is never pruned.
enrollmentJwtFromSecret: true
enrollmentJwtSecretName: ziti-router-enrollment

persistence:
  storageClass: longhorn

fabric:
  metrics:
    enabled: true
