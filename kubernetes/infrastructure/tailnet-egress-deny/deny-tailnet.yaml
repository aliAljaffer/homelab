---
# The In list must mirror egress-default.yaml's NotIn list: when a namespace
# gains its own egress policy, move its name here, or egress-default's
# allow-all neuters that policy. hermes and tailscale are tailnet-exempt;
# never add them here.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-tailnet-egress
spec:
  description: Deny tailnet egress where the namespace manages its own egress posture
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: In
        values:
          - assets
          - catus-locatus
          - chat
          - cloudflare-tunnel-system
          - excalidraw
          - fai
          - grooszy
          - keycloak
          - livesync
          - mail
          - monitoring
          - ntfy
          - pihole
          - remediator
          - stt
          - umami
          - vaultwarden
  egressDeny:
    # Tailscale CGNAT range (RFC 6598): no public IP is routed from it. Never
    # widen to 100.0.0.0/8; its lower /10 is public IPv4 space.
    - toCIDR:
        - 100.64.0.0/10
    - toCIDR:
        - fd7a:115c:a1e0::/48
