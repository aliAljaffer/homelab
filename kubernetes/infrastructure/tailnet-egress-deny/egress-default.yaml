---
# The NotIn list must mirror deny-tailnet.yaml's In list plus the two
# tailnet-exempt namespaces (hermes, tailscale). New namespaces land here
# automatically: tailnet denied, egress otherwise unchanged.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: tailnet-egress-default
spec:
  description: Allow-all egress minus the tailnet for namespaces without their own egress policy
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - assets
          - catus-locatus
          - chat
          - cloudflare-tunnel-system
          - excalidraw
          - fai
          - grooszy
          - hermes
          - keycloak
          - livesync
          - mail
          - monitoring
          - ntfy
          - pihole
          - remediator
          - stt
          - tailscale
          - umami
          - vaultwarden
  # Empty egress rules (- {}) compile to no allow on Cilium 1.17, so allow
  # every identity explicitly; the deny below still wins for the tailnet.
  egress:
    - toEntities:
        - cluster
        - world
        - host
        - remote-node
        - kube-apiserver
        - init
  egressDeny:
    - toCIDR:
        - 100.64.0.0/10
    - toCIDR:
        - fd7a:115c:a1e0::/48
