---
deploymentMode: SingleBinary

loki:
  auth_enabled: false

  analytics:
    reporting_enabled: false

  commonConfig:
    replication_factor: 1

  # The chart has no storage.secretName; credentials come from extraEnv/extraVolumes below.
  storage:
    type: gcs
    bucketNames:
      chunks: alialjaffer-homelab
      ruler: alialjaffer-homelab
      admin: alialjaffer-homelab

  schemaConfig:
    configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: gcs
      schema: v13
      index:
        prefix: loki_index_
        period: 24h

  limits_config:
    retention_period: 168h
    reject_old_samples: false
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
    per_stream_rate_limit: 8MB
    per_stream_rate_limit_burst: 30MB
    split_queries_by_interval: 15m
    volume_enabled: true

  compactor:
    retention_enabled: true
    delete_request_store: gcs
    working_directory: /var/loki/retention

  query_range:
    results_cache:
      cache:
        embedded_cache:
          enabled: true
          max_size_mb: 100

singleBinary:
  replicas: 1
  persistence:
    storageClass: longhorn
    size: 5Gi
  resources:
    requests:
      cpu: 70m
      memory: 560Mi
    limits:
      memory: 1120Mi
  extraEnv:
    - name: GOOGLE_APPLICATION_CREDENTIALS
      value: /etc/loki/gcs-credentials/service_account.json
  extraVolumes:
    - name: gcs-credentials
      secret:
        secretName: loki-gcs-credentials
  extraVolumeMounts:
    - name: gcs-credentials
      mountPath: /etc/loki/gcs-credentials
      readOnly: true

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

gateway:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 48Mi

sidecar:
  resources:
    requests:
      cpu: 15m
      memory: 104Mi
    limits:
      memory: 208Mi

lokiCanary:
  lokiurl: loki.monitoring.svc.cluster.local:3100
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

chunksCache:
  allocatedMemory: 256

resultsCache:
  allocatedMemory: 256

monitoring:
  selfMonitoring:
    enabled: false
  lokiCanary:
    enabled: false
  dashboards:
    enabled: true
    namespace: monitoring
    labels:
      grafana_dashboard: "1"

test:
  enabled: false
