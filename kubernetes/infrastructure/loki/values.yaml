---
# Loki single-binary mode with MinIO (S3) backend
# 90-day log retention enforced by the compactor

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  # Use MinIO as the S3-compatible object store
  storage:
    type: s3
    s3:
      endpoint: minio.catus-locatus.svc.cluster.local:9000
      bucketnames: loki
      region: us-east-1  # required by Loki even for MinIO
      s3ForcePathStyle: true
      insecure: true
    # Credentials come from the loki-minio-secret (SealedSecret)
    # Set via loki.storage_config.aws.access_key_id / secret_access_key
    secretName: loki-minio-secret

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    retention_period: 2160h  # 90 days
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
    per_stream_rate_limit: 3MB
    per_stream_rate_limit_burst: 15MB
    split_queries_by_interval: 15m

  compactor:
    retention_enabled: true
    delete_request_store: s3
    working_directory: /var/loki/retention

  query_range:
    results_cache:
      cache:
        embedded_cache:
          enabled: true
          max_size_mb: 100

# Single-binary deployment (1 replica, sufficient for homelab)
singleBinary:
  replicas: 1
  persistence:
    storageClass: longhorn
    size: 5Gi  # WAL + temp storage; actual data is in MinIO

# Disable microservice mode components
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Disable bundled Grafana agent (we use Alloy)
monitoring:
  selfMonitoring:
    enabled: false
  lokiCanary:
    enabled: false
  dashboards:
    enabled: true
    namespace: monitoring
    labels:
      grafana_dashboard: "1"

test:
  enabled: false
