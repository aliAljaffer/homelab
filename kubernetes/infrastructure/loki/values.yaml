---
deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: gcs
    bucketNames:
      chunks: alialjaffer-homelab
      ruler: alialjaffer-homelab
      admin: alialjaffer-homelab
    # Credentials mounted via singleBinary.extraEnv/extraVolumes below (chart has no storage.secretName field).

  schemaConfig:
    configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: gcs
      schema: v13
      index:
        prefix: loki_index_
        period: 24h

  limits_config:
    retention_period: 168h
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
    per_stream_rate_limit: 8MB
    per_stream_rate_limit_burst: 30MB
    split_queries_by_interval: 15m
    volume_enabled: true

  compactor:
    retention_enabled: true
    delete_request_store: gcs
    working_directory: /var/loki/retention

  query_range:
    results_cache:
      cache:
        embedded_cache:
          enabled: true
          max_size_mb: 100

singleBinary:
  replicas: 1
  persistence:
    storageClass: longhorn
    size: 5Gi # WAL + temp storage; actual data is in GCS
  resources:
    requests:
      cpu: 70m
      memory: 560Mi
    limits:
      cpu: 210m
      memory: 1120Mi
  # Chart has no storage.secretName field; GCS SDK reads GOOGLE_APPLICATION_CREDENTIALS.
  # Secret: loki-gcs-credentials SealedSecret, key service_account.json
  extraEnv:
    - name: GOOGLE_APPLICATION_CREDENTIALS
      value: /etc/loki/gcs-credentials/service_account.json
  extraVolumes:
    - name: gcs-credentials
      secret:
        secretName: loki-gcs-credentials
  extraVolumeMounts:
    - name: gcs-credentials
      mountPath: /etc/loki/gcs-credentials
      readOnly: true

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

gateway:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      cpu: 30m
      memory: 48Mi

# sidecar here is the k8s-sidecar container (loki-sc-rules) that loads alerting/recording rules from ConfigMaps
sidecar:
  resources:
    requests:
      cpu: 15m
      memory: 104Mi
    limits:
      cpu: 45m
      memory: 208Mi

# monitoring.lokiCanary.enabled: false below is the wrong key and does nothing (no such field in
# this chart's schema). Real toggle is top-level lokiCanary.enabled. Canary is running unintentionally;
# to disable it, set lokiCanary: {enabled: false} at the top level.
lokiCanary:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 60m
      memory: 128Mi

# selfMonitoring off: Alloy handles this instead of the chart's bundled agent
monitoring:
  selfMonitoring:
    enabled: false
  lokiCanary:
    enabled: false
  dashboards:
    enabled: true
    namespace: monitoring
    labels:
      grafana_dashboard: "1"

test:
  enabled: false
