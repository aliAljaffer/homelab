---
# Loki single-binary mode with MinIO (S3) backend
# 7-day log retention enforced by the compactor

# Chart defaults to SimpleScalable; without this switch, read/write/backend
# (explicitly disabled below) are the only serving components, leaving Loki
# with zero ingest/query capacity despite singleBinary.replicas: 1.
deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: gcs
    bucketNames:
      chunks: alialjaffer-homelab
      ruler: alialjaffer-homelab
      admin: alialjaffer-homelab
    # Credentials mounted via singleBinary.extraVolumes/extraEnv below
    # (this chart has no storage.secretName field; GOOGLE_APPLICATION_CREDENTIALS
    # is how the GCS SDK picks up the mounted loki-gcs-credentials secret).

  schemaConfig:
    configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: gcs
      schema: v13
      index:
        prefix: loki_index_
        period: 24h

  limits_config:
    retention_period: 168h # 7 days
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
    per_stream_rate_limit: 3MB
    per_stream_rate_limit_burst: 15MB
    split_queries_by_interval: 15m
    volume_enabled: true

  compactor:
    retention_enabled: true
    delete_request_store: gcs
    working_directory: /var/loki/retention

  query_range:
    results_cache:
      cache:
        embedded_cache:
          enabled: true
          max_size_mb: 100

# Single-binary deployment (1 replica, sufficient for homelab)
singleBinary:
  replicas: 1
  persistence:
    storageClass: longhorn
    size: 5Gi # WAL + temp storage; actual data is in MinIO
  # GCS credentials (chart has no storage.secretName field; the GCS SDK
  # reads GOOGLE_APPLICATION_CREDENTIALS instead).
  # Secret: loki-gcs-credentials SealedSecret, key: service_account.json
  extraEnv:
    - name: GOOGLE_APPLICATION_CREDENTIALS
      value: /etc/loki/gcs-credentials/service_account.json
  extraVolumes:
    - name: gcs-credentials
      secret:
        secretName: loki-gcs-credentials
  extraVolumeMounts:
    - name: gcs-credentials
      mountPath: /etc/loki/gcs-credentials
      readOnly: true

# Disable microservice mode components
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Disable bundled Grafana agent (we use Alloy)
monitoring:
  selfMonitoring:
    enabled: false
  lokiCanary:
    enabled: false
  dashboards:
    enabled: true
    namespace: monitoring
    labels:
      grafana_dashboard: "1"

test:
  enabled: false
