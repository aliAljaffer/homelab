---
kubeProxyReplacement: true
k8sServiceHost: 192.168.8.250
k8sServicePort: 6443

policyAuditMode: true

ipam:
  mode: kubernetes

gatewayAPI:
  enabled: true

resources:
  requests:
    cpu: 125m
    memory: 560Mi
  limits:
    memory: 1120Mi

envoy:
  resources:
    requests:
      cpu: 10m
      memory: 88Mi
    limits:
      memory: 176Mi

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    labels:
      release: monitoring

hubble:
  enabled: true
  relay:
    enabled: true
    resources:
      requests:
        cpu: 35m
        memory: 40Mi
      limits:
        memory: 80Mi
  ui:
    enabled: true
    backend:
      resources:
        requests:
          cpu: 30m
          memory: 72Mi
        limits:
          memory: 144Mi
    frontend:
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          memory: 32Mi

operator:
  replicas: 1
  prometheus:
    serviceMonitor:
      enabled: true
      labels:
        release: monitoring
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 384Mi

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
