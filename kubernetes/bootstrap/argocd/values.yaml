---
global:
  domain: argocd.alialjaffer.com

server:
  # --insecure is safe: TLS terminates at the Gateway, not here.
  extraArgs:
  - --insecure
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  # No CPU limit: a 20m cap (2ms per 100ms CFS period) throttled this pod in
  # ~80% of periods and stalled the UI. CPU is compressible; cap memory only.
  resources:
    requests:
      cpu: 100m
      memory: 392Mi
    limits:
      memory: 784Mi

controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  resources:
    requests:
      cpu: 480m
      memory: 1520Mi
    limits:
      cpu: 1440m
      memory: 3040Mi

repoServer:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  # Wider margin than the standard 2.6x formula. repo-server memory spikes
  # hard templating the heavy kube-prometheus-stack chart, and an OOMKill
  # here stalls GitOps reconciliation cluster-wide.
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      cpu: 2000m
      memory: 1229Mi

applicationSet:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  resources:
    requests:
      cpu: 50m
      memory: 80Mi
    limits:
      memory: 160Mi

notifications:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  resources:
    requests:
      cpu: 50m
      memory: 88Mi
    limits:
      memory: 176Mi
  # Email notifications via Resend SMTP. The API key lives in
  # argocd-notifications-secret (SealedSecret in kubernetes/argocd/) and is
  # referenced below as $email-password. secret.create:false so Helm does not
  # own that secret.
  # Named notifier: the key is service.<type>, the block is the SMTP options.
  # The notifier is registered as "email", which is what the subscription
  # recipients below reference (email:<address>).
  notifiers:
    service.email: |
      host: smtp.resend.com
      port: 587
      from: homelab@alialjaffer.com
      username: resend
      password: $email-password
  templates:
    template.app-sync-failed: |
      email:
        subject: '[ArgoCD] Sync failed: {{.app.metadata.name}}'
      message: |
        Application {{.app.metadata.name}} failed to sync.
        Sync status: {{.app.status.sync.status}}
        Health: {{.app.status.health.status}}
        {{- if .app.status.operationState }}
        {{ .app.status.operationState.message }}
        {{- end }}
    template.app-health-degraded: |
      email:
        subject: '[ArgoCD] Degraded: {{.app.metadata.name}}'
      message: |
        Application {{.app.metadata.name}} has degraded.
        Health: {{.app.status.health.status}}
  triggers:
    trigger.on-sync-failed: |
      - description: Application syncing has failed
        send: [app-sync-failed]
        when: app.status.operationState.phase in ['Error', 'Failed']
    trigger.on-health-degraded: |
      - description: Application has degraded
        send: [app-health-degraded]
        when: app.status.health.status == 'Degraded'
  subscriptions:
    - recipients:
        - email:ahjfr@icloud.com
      triggers:
        - on-sync-failed
        - on-health-degraded
  secret:
    create: false
    name: argocd-notifications-secret

dex:
  image:
    tag: v2.45.1-alpine@sha256:f5f9fb373188b0f701b80edd68b3f4745ced69306c9d382999f11b7774335a98
  # Dex 2.45 no longer serves Prometheus metrics, so the chart's metrics
  # ServiceMonitor scrapes a dead port (5558). Disable it to stop the
  # TargetDown alert.
  metrics:
    enabled: false
    serviceMonitor:
      enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 48Mi
    limits:
      memory: 96Mi

redis:
  exporter:
    enabled: true
    image:
      tag: v1.88.0-alpine@sha256:9291e77fd407f766272ed9dfe7521a525452cb9b8e384cec59faf0c21ded550f
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        cpu: 20m
        memory: 32Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  resources:
    requests:
      cpu: 50m
      memory: 120Mi
    limits:
      memory: 240Mi

configs:
  params:
    server.insecure: "true"
  cm:
    # Excludes CiliumIdentity: it's managed by Talos bootstrap, not ArgoCD.
    resource.exclusions: |
      - apiGroups:
          - cilium.io
        kinds:
          - CiliumIdentity
        clusters:
          - "*"
  repositories:
    homelab:
      url: git@github.com:aliAljaffer/homelab.git
      name: homelab
      type: git
