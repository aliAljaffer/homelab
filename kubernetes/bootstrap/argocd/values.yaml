---
global:
  domain: argocd.alialjaffer.com

server:
  # --insecure is safe: TLS terminates at the Gateway, not here.
  extraArgs:
  - --insecure
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  resources:
    requests:
      cpu: 5m
      memory: 392Mi
    limits:
      cpu: 20m
      memory: 784Mi

controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  resources:
    requests:
      cpu: 480m
      memory: 1520Mi
    limits:
      cpu: 1440m
      memory: 3040Mi

repoServer:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  # Wider margin than the standard 2.6x formula. repo-server memory spikes
  # hard templating the heavy kube-prometheus-stack chart, and an OOMKill
  # here stalls GitOps reconciliation cluster-wide.
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      cpu: 2000m
      memory: 1229Mi

applicationSet:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  resources:
    requests:
      cpu: 5m
      memory: 80Mi
    limits:
      cpu: 20m
      memory: 160Mi

notifications:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  resources:
    requests:
      cpu: 5m
      memory: 88Mi
    limits:
      cpu: 20m
      memory: 176Mi

dex:
  image:
    tag: v2.45.1-alpine
  # Dex 2.45 no longer serves Prometheus metrics, so the chart's metrics
  # ServiceMonitor scrapes a dead port (5558). Disable it to stop the
  # TargetDown alert.
  metrics:
    enabled: false
    serviceMonitor:
      enabled: false
  resources:
    requests:
      cpu: 5m
      memory: 48Mi
    limits:
      cpu: 20m
      memory: 96Mi

redis:
  exporter:
    enabled: true
    image:
      tag: v1.88.0-alpine
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        cpu: 20m
        memory: 32Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  resources:
    requests:
      cpu: 5m
      memory: 120Mi
    limits:
      cpu: 20m
      memory: 240Mi

configs:
  params:
    server.insecure: "true"
  cm:
    # Excludes CiliumIdentity: it's managed by Talos bootstrap, not ArgoCD.
    resource.exclusions: |
      - apiGroups:
          - cilium.io
        kinds:
          - CiliumIdentity
        clusters:
          - "*"
  repositories:
    homelab:
      url: git@github.com:aliAljaffer/homelab.git
      name: homelab
      type: git
