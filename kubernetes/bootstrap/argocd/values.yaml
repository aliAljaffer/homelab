---
global:
  domain: argocd.alialjaffer.com

server:
  extraArgs:
  - --insecure
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  readinessProbe:
    timeoutSeconds: 3
  livenessProbe:
    timeoutSeconds: 3
  startupProbe:
    enabled: true
    failureThreshold: 30
    timeoutSeconds: 3
  resources:
    requests:
      cpu: 100m
      memory: 392Mi
    limits:
      memory: 784Mi

controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  resources:
    requests:
      cpu: 480m
      memory: 1520Mi
    limits:
      memory: 3040Mi

repoServer:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      memory: 1229Mi

applicationSet:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  resources:
    requests:
      cpu: 50m
      memory: 80Mi
    limits:
      memory: 160Mi

notifications:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  resources:
    requests:
      cpu: 50m
      memory: 88Mi
    limits:
      memory: 176Mi
  notifiers:
    service.email: |
      host: smtp-relay.mail.svc.cluster.local
      port: 587
      from: homelab@alialjaffer.com
  templates:
    template.app-sync-failed: |
      email:
        subject: '[ArgoCD] Sync failed: {{.app.metadata.name}}'
      message: |
        Application {{.app.metadata.name}} failed to sync.
        Sync status: {{.app.status.sync.status}}
        Health: {{.app.status.health.status}}
        {{- if .app.status.operationState }}
        {{ .app.status.operationState.message }}
        {{- end }}
    template.app-health-degraded: |
      email:
        subject: '[ArgoCD] Degraded: {{.app.metadata.name}}'
      message: |
        Application {{.app.metadata.name}} has degraded.
        Health: {{.app.status.health.status}}
  triggers:
    trigger.on-sync-failed: |
      - description: Application syncing has failed
        send: [app-sync-failed]
        when: app.status.operationState.phase in ['Error', 'Failed']
    trigger.on-health-degraded: |
      - description: Application has degraded
        send: [app-health-degraded]
        when: app.status.health.status == 'Degraded'
  subscriptions:
    - recipients:
        - email:ahjfr@icloud.com
      triggers:
        - on-sync-failed
        - on-health-degraded
  secret:
    create: false
    name: argocd-notifications-secret

dex:
  image:
    tag: v2.45.1-alpine@sha256:f5f9fb373188b0f701b80edd68b3f4745ced69306c9d382999f11b7774335a98
  metrics:
    enabled: false
    serviceMonitor:
      enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 48Mi
    limits:
      memory: 96Mi

redis:
  exporter:
    enabled: true
    image:
      tag: v1.88.0-alpine@sha256:9291e77fd407f766272ed9dfe7521a525452cb9b8e384cec59faf0c21ded550f
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        memory: 32Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  resources:
    requests:
      cpu: 50m
      memory: 120Mi
    limits:
      memory: 240Mi

# Do not add configs.repositories here; it conflicts with the argocd-repo-homelab-ssh credential Secret.
configs:
  params:
    server.insecure: "true"
  cm:
    resource.exclusions: |
      - apiGroups:
          - cilium.io
        kinds:
          - CiliumIdentity
        clusters:
          - "*"
