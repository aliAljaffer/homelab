---
# ArgoCD bootstrap values
# Install with:
#   helm repo add argo https://argoproj.github.io/argo-helm
#   helm install argocd argo/argo-cd --version 10.3.0 \
#     --namespace argocd --create-namespace \
#     --values kubernetes/bootstrap/argocd/values.yaml

global:
  domain: argocd.alialjaffer.com

server:
  # TLS terminated at the Gateway
  extraArgs:
  - --insecure
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring

controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring

repoServer:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring

applicationSet:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring

notifications:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring

dex:
  image:
    tag: v2.45.1-alpine
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring

redis:
  exporter:
    enabled: true
    image:
      tag: v1.88.0-alpine
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring

configs:
  params:
    server.insecure: "true"
  cm:
    # Allow resources managed outside ArgoCD (e.g. Talos bootstrapped namespaces)
    resource.exclusions: |
      - apiGroups:
          - cilium.io
        kinds:
          - CiliumIdentity
        clusters:
          - "*"
  repositories:
    homelab:
      url: git@github.com:aliAljaffer/homelab.git
      name: homelab
      type: git
