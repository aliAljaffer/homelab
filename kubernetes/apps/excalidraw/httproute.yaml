---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: excalidraw
  namespace: excalidraw
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: cloudflare-tunnel
      namespace: cloudflare-tunnel-system
      sectionName: https
  hostnames:
    - excalidraw.alialjaffer.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /socket.io
      backendRefs:
        - name: excalidraw-room
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /api/v2/scenes
      backendRefs:
        - name: excalidraw-scenes
          port: 8080
    - backendRefs:
        - name: excalidraw
          port: 80
