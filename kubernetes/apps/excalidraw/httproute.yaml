---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: excalidraw
  namespace: excalidraw
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: cloudflare-tunnel
      namespace: cloudflare-tunnel-system
      sectionName: https
  hostnames:
    - excalidraw.alialjaffer.com
  rules:
    # Public. Gateway API picks the longest matching prefix, so these win over
    # the catch-all below whatever the order.
    - matches:
        - path:
            type: PathPrefix
            value: /socket.io
      backendRefs:
        - name: excalidraw-room
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /api/v2
      backendRefs:
        - name: excalidraw-scenes
          port: 8080
    # The private entry points: the editor at the root, a single board at /b/,
    # and the boards API. Everything a guest needs is under /s/ and must stay
    # reachable without a login.
    - matches:
        - path:
            type: Exact
            value: /
        - path:
            type: PathPrefix
            value: /b/
        - path:
            type: PathPrefix
            value: /api/boards
        - path:
            type: PathPrefix
            value: /oauth2/
      backendRefs:
        - name: oauth2-proxy
          port: 80
    - backendRefs:
        - name: excalidraw
          port: 80
