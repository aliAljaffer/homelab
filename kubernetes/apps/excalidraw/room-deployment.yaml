---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: excalidraw-room
  namespace: excalidraw
  labels:
    app: excalidraw-room
spec:
  replicas: 1
  selector:
    matchLabels:
      app: excalidraw-room
  template:
    metadata:
      labels:
        app: excalidraw-room
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: room
          image: harbor.alialjaffer.com/mirror/excalidraw-room@sha256:992e1a08fba4428cfe215b4ffd147c408ba37c70f849d4b9589f4fa6f187fcbf
          imagePullPolicy: IfNotPresent
          env:
            - name: CORS_ORIGIN
              value: https://excalidraw.alialjaffer.com
            - name: MAX_CLIENTS_PER_ROOM
              value: "20"
            - name: NODE_ENV
              value: production
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
