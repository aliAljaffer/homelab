---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: excalidraw-db
  namespace: excalidraw
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5@sha256:e6dd48683234f2b957ca2a18da4fd99e2a39a0534ac33fd2ee77e1ff7732270b
  storage:
    size: 2Gi
    storageClass: longhorn
  enableSuperuserAccess: false
  backup:
    target: prefer-standby
    volumeSnapshot:
      online: true
  bootstrap:
    initdb:
      database: excalidraw
      owner: excalidraw
      secret:
        name: excalidraw-db
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: excalidraw-db-backup
  namespace: excalidraw
spec:
  schedule: "0 15 2 * * *"
  cluster:
    name: excalidraw-db
  method: volumeSnapshot
  immediate: true
  target: prefer-standby
