---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grooszy-web
  namespace: grooszy
  labels:
    app: grooszy-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grooszy-web
  template:
    metadata:
      labels:
        app: grooszy-web
    spec:
      containers:
        - name: web
          image: harbor.alialjaffer.com/mirror/grooszy-web@sha256:6103d816d6fa6a2a3f2106c1ea87b6df1b7c88d8aa20a0b999c468c8f67c3bc1
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: grooszy-web
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
