---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grooszy-db
  namespace: grooszy
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5@sha256:e6dd48683234f2b957ca2a18da4fd99e2a39a0534ac33fd2ee77e1ff7732270b
  storage:
    size: 10Gi
    storageClass: longhorn
  enableSuperuserAccess: false
  backup:
    target: prefer-standby
    volumeSnapshot:
      online: true
  bootstrap:
    initdb:
      database: grooszy
      owner: grooszy
      secret:
        name: grooszy-postgres
