---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grooszy-api
  namespace: grooszy
  labels:
    app: grooszy-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grooszy-api
  template:
    metadata:
      labels:
        app: grooszy-api
    spec:
      containers:
        - name: api
          image: harbor.alialjaffer.com/mirror/grooszy-api@sha256:90b8a4c9e211f544879b96cd27bbc4f02a5a11c98be6e71cf7c8aba9b712c245
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: OIDC_AUDIENCE
              value: grooszy
          envFrom:
            - secretRef:
                name: grooszy-api
            - secretRef:
                name: grooszy-chat
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
