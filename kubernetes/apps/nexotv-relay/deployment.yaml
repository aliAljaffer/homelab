apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexotv-relay
  namespace: stremio
  labels:
    app: nexotv-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexotv-relay
  template:
    metadata:
      labels:
        app: nexotv-relay
    spec:
      volumes:
      - name: nexotv-relay-src
        configMap:
          name: nexotv-relay-src
      containers:
      - name: relay
        image: node:20-slim
        command: ["sh", "-c", "npm install express && node /app/relay.js"]
        workingDir: /app
        ports:
        - containerPort: 7001
        env:
        - name: PORT
          value: "7001"
        volumeMounts:
        - name: nexotv-relay-src
          mountPath: /app/relay.js
          subPath: relay.js
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 512Mi
