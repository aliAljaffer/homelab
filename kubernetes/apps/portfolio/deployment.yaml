---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: portfolio
  name: portfolio
  namespace: portfolio
spec:
  replicas: 3
  selector:
    matchLabels:
      app: portfolio
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: portfolio
    spec:
      containers:
        - image: ghcr.io/alialjaffer/portfolio-website@sha256:3c86ca61c1282b79f79b1859349a7e32b5f2f4e6a827ecb792759c9f6fa271a0
          livenessProbe:
            httpGet:
              path: /
              port: 80
          name: nginx
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
                - SETGID
                - SETUID
                - NET_BIND_SERVICE
              drop:
                - ALL
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app: portfolio
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
