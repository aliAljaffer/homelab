---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
  name: portfolio
  namespace: portfolio
spec:
  hostnames:
    - portfolio.alialjaffer.com
  parentRefs:
    - name: cloudflare-tunnel
      namespace: cloudflare-tunnel-system
      sectionName: https
  rules:
    - backendRefs:
        - name: portfolio
          port: 80
