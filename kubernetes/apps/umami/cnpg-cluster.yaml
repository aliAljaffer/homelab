---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: umami-db
  namespace: umami
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5@sha256:e6dd48683234f2b957ca2a18da4fd99e2a39a0534ac33fd2ee77e1ff7732270b
  storage:
    size: 5Gi
    storageClass: longhorn
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: umami
      owner: umami
      secret:
        name: umami-postgres