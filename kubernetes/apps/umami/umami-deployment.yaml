---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umami
  namespace: umami
  labels:
    app: umami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: umami
  template:
    metadata:
      labels:
        app: umami
    spec:
      containers:
        - name: umami
          image: ghcr.io/umami-software/umami:postgresql-latest@sha256:6cd9d24a836fac5c226c3c90cb25141d4560b7270b7827f393ccf09bf3f83b18
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_TYPE
              value: postgresql
            - name: TRACKER_SCRIPT_NAME
              value: assets/web.js
          envFrom:
            - secretRef:
                name: umami-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/heartbeat
              port: 3000
          readinessProbe:
            httpGet:
              path: /api/heartbeat
              port: 3000