---
# Classic per-ingress proxy mode, like hermes and hindsight. The tailnet name is
# omniroute.tail6c5083.ts.net; the operator issues the certificate. The shared
# ProxyGroup is avoided because of the stale-address bug on operator v1.104.7.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omniroute-tailnet
  namespace: omniroute
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - omniroute
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: omniroute
                port:
                  number: 20128
