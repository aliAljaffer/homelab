---
apiVersion: v1
kind: ConfigMap
metadata:
  name: omniroute-config
  namespace: omniroute
data:
  DATA_DIR: /app/data
  PORT: "20128"
  DASHBOARD_PORT: "20128"
  # API_PORT stays unset so the API and the dashboard share PORT. Setting it
  # makes the API listen on a second port the Service does not expose.
  API_HOST: 0.0.0.0
  LIVE_WS_PORT: "20132"
  LIVE_WS_HOST: 0.0.0.0
  # The dashboard live view is not routed through the tailnet Ingress, so the
  # browser falls back to polling. Keep the origin allowed for an in-cluster
  # port-forward to the WebSocket port.
  LIVE_WS_ALLOWED_ORIGINS: https://omniroute.tail6c5083.ts.net
  NEXT_PUBLIC_BASE_URL: https://omniroute.tail6c5083.ts.net
  OMNIROUTE_PUBLIC_URL: https://omniroute.tail6c5083.ts.net
  # Tailscale terminates TLS, so the session cookie must carry Secure.
  AUTH_COOKIE_SECURE: "true"
  APP_LOG_LEVEL: info
  # Every /v1/* call needs a key. The dashboard keeps its own password login.
  REQUIRE_API_KEY: "true"
  SHUTDOWN_TIMEOUT_MS: "30000"
  # Keep below the 4Gi limit: past this the V8 heap errors instead of the pod
  # being OOMKilled mid-write.
  NODE_OPTIONS: --max-old-space-size=3072
