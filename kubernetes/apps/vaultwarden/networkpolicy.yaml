apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vaultwarden-default
  namespace: vaultwarden
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": cloudflare-tunnel-system
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
          rules:
            http:
              - path: '/$'
              - path: '/(api|identity|notifications|attachments|icons|sends|events|sso|connect|twofactor|two-step|services|platform|alive|app|images|css|locales|assets|fonts|scripts)(/|\?|$)'
              - path: '/[A-Za-z0-9._-]+\.(js|css|json|png|svg|ico|xml|woff2?|html|txt|webmanifest)(\?.*)?$'
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": mail
            app.kubernetes.io/name: smtp-relay
      toPorts:
        - ports:
            - port: "587"
              protocol: TCP
