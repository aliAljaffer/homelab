---
apiVersion: hermes.agent/v1
kind: HermesInstance
metadata:
  name: hermes
  namespace: hermes
spec:
  image:
    repository: harbor.alialjaffer.com/mirror/hermes-agent
    tag: "v0.23.4"
    pullPolicy: IfNotPresent
  config:
    configMapRef:
      name: hermes-agent-config
  envFrom:
    - secretRef:
        name: hermes-providers
  env:
    # Carried over from the Mac that was serving these bots. Hermes reads the
    # *_ALLOWED_USERS names, which the CRD's allowedUserIDs does not emit.
    - name: TELEGRAM_ALLOWED_USERS
      valueFrom:
        secretKeyRef:
          name: hermes-telegram
          key: allowed_users
    - name: DISCORD_ALLOWED_USERS
      valueFrom:
        secretKeyRef:
          name: hermes-discord
          key: allowed_users
    - name: MCP_FAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: hermes-fai
          key: agent-key
    # Last one wins: Hermes reads and writes $HERMES_HOME/config.yaml, and the
    # operator's copy on /opt/data is a read-only ConfigMap mount.
    - name: HERMES_HOME
      value: /opt/data/hermes
    - name: PYTHONPATH
      value: /opt/data/.local/lib/hermes-extra
    # The SSH terminal backends write on the laptops; the pod's default /opt/data
    # fence blocks write_file and patch there.
    - name: HERMES_WRITE_SAFE_ROOT
      value: "/opt/data:/Users/h:/Users/alialjaffer"
    # Desktop's remote backend: a dashboard process serving /api/status and /api/ws.
    - name: HERMES_DASHBOARD
      value: "1"
    - name: HERMES_DASHBOARD_PORT
      value: "9119"
    - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
      valueFrom:
        secretKeyRef:
          name: hermes-dashboard
          key: username
    - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
      valueFrom:
        secretKeyRef:
          name: hermes-dashboard
          key: password
    - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
      valueFrom:
        secretKeyRef:
          name: hermes-dashboard
          key: secret
    - name: HERMES_DASHBOARD_SESSION_TOKEN
      valueFrom:
        secretKeyRef:
          name: hermes-dashboard
          key: session_token
  # Seeds the writable config from the GitOps baseline once, then leaves it alone
  # so /model and `hermes config set` persist.
  initContainers:
    - name: seed-tailscale-tools
      image: tailscale/tailscale:v1.86.2
      command:
        - sh
        - -c
        - |
          set -eu
          mkdir -p /opt/data/.local/bin
          if [ ! -f /opt/data/.local/bin/tailscale ]; then
            cp /usr/local/bin/tailscale /opt/data/.local/bin/tailscale
            chmod 755 /opt/data/.local/bin/tailscale
          fi
          if [ ! -f /opt/data/.local/bin/ssh ] || ! grep -q 'k8s-prsnl' /opt/data/.local/bin/ssh; then
            echo '' | base64 -d > /opt/data/.local/bin/ssh
            chmod +x /opt/data/.local/bin/ssh
          fi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
        runAsNonRoot: false
        runAsUser: 0
        readOnlyRootFilesystem: false
        seccompProfile:
          type: Unconfined
      volumeMounts:
        - name: data
          mountPath: /opt/data
    - name: seed-live-config
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          set -eu
          mkdir -p /opt/data/hermes
          if [ ! -f /opt/data/hermes/config.yaml ]; then
            cp /seed/config.yaml /opt/data/hermes/config.yaml
            echo "seeded live config from the GitOps baseline"
          else
            echo "keeping existing live config"
          fi
          chown -R 1000:1000 /opt/data/hermes
      volumeMounts:
        - name: data
          mountPath: /opt/data
        - name: config-seed
          mountPath: /seed
          readOnly: true
    # The docker-managed image cannot install plugin Python deps at runtime
    # ("install out of sync"). The hindsight memory plugin needs these two; the
    # rest of its dependencies already ship in the image venv, hence --no-deps.
    - name: seed-plugin-deps
      image: python:3.14-slim
      command:
        - sh
        - -c
        - |
          set -eu
          target=/opt/data/.local/lib/hermes-extra
          pip install -q --disable-pip-version-check --no-deps --upgrade --target "$target" \
            hindsight-client==1.3.0 aiohttp-retry==2.9.1
          chown -R 1000:1000 /opt/data/.local
      volumeMounts:
        - name: data
          mountPath: /opt/data
  extraVolumes:
    - name: config-seed
      configMap:
        name: hermes-agent-config
    - name: ssh-key
      secret:
        secretName: hermes-ssh-key
        defaultMode: 0400
    - name: agents-deploy-key
      secret:
        secretName: hermes-agents-deploy-key
        defaultMode: 0400
    - name: tailscale-tmp
      emptyDir: {}
    - name: tailscale-sock
      emptyDir: {}
  extraVolumeMounts:
    - name: ssh-key
      mountPath: /opt/data/hermes/.ssh
      readOnly: true
    - name: tailscale-sock
      mountPath: /tmp/tailscale-sock
  networking:
    service:
      ports:
        - name: gateway
          port: 8443
        - name: dashboard
          port: 9119
        - name: webapp
          port: 5555
  gateways:
    telegram:
      enabled: true
      botTokenSecretRef:
        name: hermes-telegram
        key: token
    discord:
      enabled: true
      botTokenSecretRef:
        name: hermes-discord
        key: token
  security:
    # s6 needs the runtime's default capabilities (SETUID/SETGID/CHOWN/etc.).
    # Do not set capabilities here: drop:ALL removes them and s6 crashes.
    networkPolicy:
      additionalEgress:
        - {}   # outbound ALLOW all
  # Work around operator liveness defaults that kill this image mid-init and
  # during >6s event-loop stalls: startup gates the 3 min s6 boot.
  probes:
    startup:
      httpGet:
        path: /health
        port: gateway
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 36
    liveness:
      httpGet:
        path: /health
        port: gateway
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 4
    readiness:
      httpGet:
        path: /health
        port: gateway
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
  storage:
    persistence:
      enabled: true
      size: 100Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  # spec.backup is parked: the 0.2.0 operator renders a restic job with no /tmp
  # mount under a read-only rootfs and the pre-/opt/data Hermes home. Backups run
  # from backup-cronjob.yaml instead. Revisit when upstream ships the fix.
  # backup:
  #   s3:
  #     endpoint: https://881a1bbc837d9267838abe31ea386ef7.r2.cloudflarestorage.com
  #     bucket: my-hermes
  #     region: auto
  #     pathPrefix: hermes/
  #     credentialsSecretRef:
  #       name: hermes-backup
  #   schedule: "0 3 * * *"
  #   onDelete: true
  #   preUpdate: true
  #   historyLimit: 14
  sidecars:
    # The hermes image only maps uid 1000 in its entrypoint, and ssh refuses a uid
    # with no passwd entry. Ubuntu noble ships uid 1000 (ubuntu) out of the box.
    - name: skills-sync
      image: buildpack-deps:noble-scm
      env:
        - name: HOME
          value: /tmp
      command:
        - /bin/sh
        - -c
      args:
        - |
          set -u
          # Secret volumes get group-read from fsGroup, which ssh rejects as too open.
          (umask 077; cp /keys/id_ed25519 /tmp/agents-key)
          export GIT_SSH_COMMAND="ssh -i /tmp/agents-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/known_hosts"
          repo=/opt/data/agents
          until [ -d "$repo/.git" ] || git clone -q git@github.com:aliAljaffer/agents.git "$repo"; do sleep 60; done
          git -C "$repo" config user.name "hermes pod"
          git -C "$repo" config user.email "hermes-pod@users.noreply.github.com"
          while true; do
            sh "$repo/scripts/sync-skills.sh" "$repo" || true
            sleep 300
          done
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        readOnlyRootFilesystem: false
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 256Mi
      volumeMounts:
        - name: data
          mountPath: /opt/data
        - name: agents-deploy-key
          mountPath: /keys
          readOnly: true
    - name: tailscale
      image: tailscale/tailscale:v1.86.2
      command:
        - /bin/sh
        - -c
      args:
        - |
          tailscaled --tun=userspace-networking --state=mem: --socket=/tmp/tailscale-sock/tailscaled.sock --socks5-server=127.0.0.1:1080 >/tmp/tsd.log 2>&1 &
          sleep 5
          tailscale --socket=/tmp/tailscale-sock/tailscaled.sock up --auth-key="$TS_AUTHKEY" --hostname=hermes-egress --accept-routes 2>&1 | tail -3
          tail -f /tmp/tsd.log
      env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: hermes-tailscale
              key: authKey
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 1000
        readOnlyRootFilesystem: false
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: tailscale-tmp
          mountPath: /tmp
        - name: tailscale-sock
          mountPath: /tmp/tailscale-sock
  # Exposed on the tailnet by ingress-tailnet.yaml instead of spec.tailscale: the
  # operator's Serve sidecar cannot start in-cluster (its ServiceAccount has no
  # token, so containerboot fails at kube-client init).
  tailscale:
    enabled: false
