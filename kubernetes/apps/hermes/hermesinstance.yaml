---
apiVersion: hermes.agent/v1
kind: HermesInstance
metadata:
  name: hermes
  namespace: hermes
spec:
  image:
    repository: harbor.alialjaffer.com/mirror/stubbi/hermes-agent
    tag: "v0.16.0"
    digest: sha256:9cdf83f00462bf263f06fd8b290bfb112cee16f0bb630b80746677bacd303185
    pullPolicy: Always
  config:
    configMapRef:
      name: hermes-agent-config
  envFrom:
    - secretRef:
        name: hermes-providers
  env:
    - name: FAI_AGENT_KEY
      valueFrom:
        secretKeyRef:
          name: hermes-fai
          key: agent-key
  storage:
    persistence:
      enabled: true
      size: 100Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  tailscale:
    enabled: true
    mode: serve
    hostname: hermes
    authKey:
      secretRef:
        name: hermes-tailscale
        key: authKey
