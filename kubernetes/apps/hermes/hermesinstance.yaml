---
apiVersion: hermes.agent/v1
kind: HermesInstance
metadata:
  name: hermes
  namespace: hermes
spec:
  image:
    repository: nousresearch/hermes-agent
    tag: "v0.23.3"
    pullPolicy: IfNotPresent
  config:
    configMapRef:
      name: hermes-agent-config
  envFrom:
    - secretRef:
        name: hermes-providers
  env:
    # Carried over from the Mac that was serving these bots. Hermes reads the
    # *_ALLOWED_USERS names, which the CRD's allowedUserIDs does not emit.
    - name: TELEGRAM_ALLOWED_USERS
      valueFrom:
        secretKeyRef:
          name: hermes-telegram
          key: allowed_users
    - name: DISCORD_ALLOWED_USERS
      valueFrom:
        secretKeyRef:
          name: hermes-discord
          key: allowed_users
    - name: MCP_FAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: hermes-fai
          key: agent-key
    # Last one wins: Hermes reads and writes $HERMES_HOME/config.yaml, and the
    # operator's copy on /opt/data is a read-only ConfigMap mount.
    - name: HERMES_HOME
      value: /opt/data/hermes
    # Desktop's remote backend: a dashboard process serving /api/status and /api/ws.
    - name: HERMES_DASHBOARD
      value: "1"
    - name: HERMES_DASHBOARD_PORT
      value: "9119"
    - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
      valueFrom:
        secretKeyRef:
          name: hermes-dashboard
          key: username
    - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
      valueFrom:
        secretKeyRef:
          name: hermes-dashboard
          key: password
    - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
      valueFrom:
        secretKeyRef:
          name: hermes-dashboard
          key: secret
  # Seeds the writable config from the GitOps baseline once, then leaves it alone
  # so /model and `hermes config set` persist.
  initContainers:
    - name: seed-live-config
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          set -eu
          mkdir -p /opt/data/hermes
          if [ ! -f /opt/data/hermes/config.yaml ]; then
            cp /seed/config.yaml /opt/data/hermes/config.yaml
            echo "seeded live config from the GitOps baseline"
          else
            echo "keeping existing live config"
          fi
          chown -R 1000:1000 /opt/data/hermes
      volumeMounts:
        - name: data
          mountPath: /opt/data
        - name: config-seed
          mountPath: /seed
          readOnly: true
  extraVolumes:
    - name: config-seed
      configMap:
        name: hermes-agent-config
    - name: ssh-key
      secret:
        secretName: hermes-ssh-key
        defaultMode: 0400
    - name: tailscale-tmp
      emptyDir: {}
  networking:
    service:
      ports:
        - name: gateway
          port: 8443
        - name: dashboard
          port: 9119
  gateways:
    telegram:
      enabled: true
      botTokenSecretRef:
        name: hermes-telegram
        key: token
    discord:
      enabled: true
      botTokenSecretRef:
        name: hermes-discord
        key: token
  security:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
    networkPolicy:
      additionalEgress:
        - {}   # outbound ALLOW all
  storage:
    persistence:
      enabled: true
      size: 100Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  # spec.backup is parked: the 0.2.0 operator renders a restic job with no /tmp
  # mount under a read-only rootfs and the pre-/opt/data Hermes home. Backups run
  # from backup-cronjob.yaml instead. Revisit when upstream ships the fix.
  # backup:
  #   s3:
  #     endpoint: https://881a1bbc837d9267838abe31ea386ef7.r2.cloudflarestorage.com
  #     bucket: my-hermes
  #     region: auto
  #     pathPrefix: hermes/
  #     credentialsSecretRef:
  #       name: hermes-backup
  #   schedule: "0 3 * * *"
  #   onDelete: true
  #   preUpdate: true
  #   historyLimit: 14
  sidecars:
    - name: tailscale
      image: tailscale/tailscale:v1.86.2
      command:
        - /bin/sh
        - -c
      args:
        - |
          tailscaled --tun=userspace-networking --state=mem: --socket=/tmp/tailscaled.sock --socks5-server=127.0.0.1:1080 >/tmp/tsd.log 2>&1 &
          sleep 5
          tailscale --socket=/tmp/tailscaled.sock up --auth-key="$TS_AUTHKEY" --hostname=hermes-egress --accept-routes 2>&1 | tail -3
          tail -f /tmp/tsd.log
      env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: hermes-tailscale
              key: authKey
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 1000
        readOnlyRootFilesystem: false
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: tailscale-tmp
          mountPath: /tmp
  # Exposed on the tailnet by ingress-tailnet.yaml instead of spec.tailscale: the
  # operator's Serve sidecar cannot start in-cluster (its ServiceAccount has no
  # token, so containerboot fails at kube-client init).
  tailscale:
    enabled: false
