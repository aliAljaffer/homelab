---
# Tailnet exposure for the gateway (OpenAI-compatible API on 8443). The
# tailscale Ingress only publishes the dashboard (9119); this Service gets a
# dedicated proxy via the operator's classic Service-exposure flow. Clients
# use http://hermes-gateway.tail6c5083.ts.net:8443/v1 - plain TCP inside the
# WireGuard tunnel, no TLS termination needed for API-key auth.
apiVersion: v1
kind: Service
metadata:
  name: hermes-gateway
  namespace: hermes
  labels:
    app.kubernetes.io/instance: hermes
    app.kubernetes.io/name: hermes-agent
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: hermes-gateway
spec:
  selector:
    app.kubernetes.io/instance: hermes
    app.kubernetes.io/name: hermes-agent
  ports:
    - name: gateway
      port: 8443
      targetPort: 8443
      protocol: TCP
