---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-tailnet
  namespace: hermes
  annotations:
    tailscale.com/proxy-group: tailnet-ingress
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - hermes
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hermes
                port:
                  number: 8443
