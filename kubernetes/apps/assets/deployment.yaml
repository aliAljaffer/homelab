---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: assets
  name: assets
  namespace: assets
spec:
  replicas: 2
  selector:
    matchLabels:
      app: assets
  template:
    metadata:
      labels:
        app: assets
    spec:
      containers:
        - image: harbor.alialjaffer.com/mirror/assets@sha256:66efd1a971223bf9a0c64f63e64316b6a654883ef2e525f97b51bca970f321db
          livenessProbe:
            httpGet:
              path: /documents/ali_aljaffer_cv.pdf
              port: 80
          name: nginx
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /documents/ali_aljaffer_cv.pdf
              port: 80
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 20m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
                - SETGID
                - SETUID
                - NET_BIND_SERVICE
              drop:
                - ALL
