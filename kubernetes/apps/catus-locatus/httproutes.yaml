---
# Backend API
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: catus-locatus-api
  namespace: catus-locatus
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - api.catusloc8s.com
  rules:
    - backendRefs:
        - name: catus-locatus-svc
          port: 4001
---
# Frontend
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: catus-locatus-fe
  namespace: catus-locatus
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - catusloc8s.com
  rules:
    - backendRefs:
        - name: catus-locatus-fe-svc
          port: 3000
---
# MinIO console (internal access)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-console
  namespace: catus-locatus
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - minio.alialjaffer.com
  rules:
    - backendRefs:
        - name: minio-svc
          port: 9001
