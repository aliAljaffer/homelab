# Default-deny + explicit-allow for the catus-locatus namespace.
# Matrix source: CONTEXT-networkpolicy-audit.md
#
# NOT yet wired into kustomization.yaml. Apply only after
# kubernetes/bootstrap/cilium/values.yaml's policyAuditMode: true has been
# rolled out and confirmed live (helm upgrade), so a mistake here logs
# instead of dropping real traffic.
#
# Pre-existing bug found while writing this (unrelated to NetworkPolicy,
# flagging separately): httproutes.yaml's "minio-console" HTTPRoute backends
# to minio-svc:9001, but minio-svc.yaml only exposes port 9000 - there is no
# port-9001 Service port, so that route has no live endpoint today even
# though minio-statefulset.yaml's container does listen on 9001. The ingress
# rule below allows 9001 anyway so it starts working the moment that Service
# is fixed, rather than needing another NetworkPolicy edit then.
#
# cl-fe (frontend) calls its backend at a relative "/api/" URL from the
# browser (deploy-frontend.yaml VITE_CATUS_LOCATUS_API_URL), not pod-to-pod,
# so cl-fe has no egress rule to cl-be here.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cl-be-default
  namespace: catus-locatus
spec:
  endpointSelector:
    matchLabels:
      app: cl-be
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": cloudflared
      toPorts:
        - ports:
            - port: "4001"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
      toPorts:
        - ports:
            - port: "4001"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            app: minio-svc
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: catus-locatus-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cl-fe-default
  namespace: catus-locatus
spec:
  endpointSelector:
    matchLabels:
      app: cl-fe
  ingress:
    # cl-fe-svc is 80 -> targetPort 8080 (deploy-frontend.yaml containerPort);
    # Cilium enforces on the post-DNAT (real) port, confirmed via Hubble.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": cloudflared
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: minio-default
  namespace: catus-locatus
spec:
  endpointSelector:
    matchLabels:
      app: minio
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": cloudflared
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app: cl-be
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    # kube-system: Gateway API gateway pod (homelab-gateway), MinIO console
    # route - see the port-9001 bug noted above.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
      toPorts:
        - ports:
            - port: "9001"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: catus-locatus-db-default
  namespace: catus-locatus
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: catus-locatus-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: cl-be
        - matchLabels:
            cnpg.io/cluster: catus-locatus-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Flag #2 in CONTEXT-networkpolicy-audit.md: CNPG operator -> instance
    # (failover/switchover/backup orchestration) wasn't observed live during
    # the capture window. Pre-allowing per the doc's option (a).
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": cnpg-system
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: catus-locatus-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
