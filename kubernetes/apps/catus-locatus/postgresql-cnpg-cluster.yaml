---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: catus-locatus-db
  namespace: catus-locatus
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgis:17-3.5-9
  storage:
    size: 20Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: catus_locatus
      owner: catus_locatus_user
      import:
        type: microservice
        databases:
          - catus_locatus
        source:
          externalCluster: catus-locatus-legacy
  externalClusters:
    - name: catus-locatus-legacy
      connectionParameters:
        host: postgresql-svc.catus-locatus.svc.cluster.local
        user: catus_locatus_user
        dbname: catus_locatus
        sslmode: prefer
      password:
        name: postgresql-secret
        key: POSTGRES_PASSWORD
