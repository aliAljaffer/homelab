---
# CNPG-managed Postgres cluster for catus-locatus, replacing the postgresql-db
# StatefulSet. Bootstraps by importing the "catus_locatus" database from the
# legacy StatefulSet (see externalClusters below) via pg_dump/pg_restore.
#
# The legacy postgresql-db StatefulSet/Service/Secret/PVC must stay in place
# until this import finishes and the app has cut over to the new
# "catus-locatus-db-app" Secret (see backend-deployment.yaml).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: catus-locatus-db
  namespace: catus-locatus
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgis:17-3.5-9
  storage:
    size: 20Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: catus_locatus
      owner: catus_locatus_user
      import:
        type: microservice
        databases:
          - catus_locatus
        source:
          externalCluster: catus-locatus-legacy
  externalClusters:
    - name: catus-locatus-legacy
      connectionParameters:
        host: postgresql-svc.catus-locatus.svc.cluster.local
        user: catus_locatus_user
        dbname: catus_locatus
        sslmode: prefer
      password:
        name: postgresql-secret
        key: POSTGRES_PASSWORD
