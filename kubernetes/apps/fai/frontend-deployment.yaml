---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fai-frontend
  namespace: fai
  labels:
    app: fai-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fai-frontend
  template:
    metadata:
      labels:
        app: fai-frontend
    spec:
      containers:
        - name: fai-frontend
          image: harbor.alialjaffer.com/mirror/fai-frontend@sha256:4afb1b7ad05b9e02dbf3c87e4d5f2b4ee51500b4b3aba484771c6c979e85d96a
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
