---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fai-frontend
  namespace: fai
  labels:
    app: fai-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fai-frontend
  template:
    metadata:
      labels:
        app: fai-frontend
    spec:
      containers:
        - name: fai-frontend
          image: harbor.alialjaffer.com/mirror/fai-frontend@sha256:ab70a32ae7b649b0692ab37b8458027a686e594fee85c24dd86b909c8567354b
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
