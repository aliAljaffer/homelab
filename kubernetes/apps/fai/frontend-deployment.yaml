---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fai-frontend
  namespace: fai
  labels:
    app: fai-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fai-frontend
  template:
    metadata:
      labels:
        app: fai-frontend
    spec:
      containers:
        - name: fai-frontend
          image: ghcr.io/alialjaffer/fai-frontend@sha256:486d3c389e98a0de3b08ea66d6f5b4d67b1e901cbda765c41297baaac38b25b7
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
