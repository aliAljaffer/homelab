---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fai-frontend
  namespace: fai
  labels:
    app: fai-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fai-frontend
  template:
    metadata:
      labels:
        app: fai-frontend
    spec:
      containers:
        - name: fai-frontend
          image: harbor.alialjaffer.com/mirror/fai-frontend@sha256:1c24eb7f12a7c08ea4326d6b0cf5e1181c2768f25fb4358ccc22dd01fe1c502c
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
