---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fai
  namespace: fai
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: cloudflare-tunnel
      namespace: cloudflare-tunnel-system
      sectionName: https
  hostnames:
    - fai.alialjaffer.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: fai-backend
          port: 8080
    - backendRefs:
        - name: fai-frontend
          port: 80
