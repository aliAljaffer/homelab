---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fai-backend
  namespace: fai
  labels:
    app: fai-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fai-backend
  template:
    metadata:
      labels:
        app: fai-backend
    spec:
      containers:
        - name: fai-backend
          image: ghcr.io/alialjaffer/fai-backend@sha256:71ab058f1d22a83f29cae8aa8756facc5cd79b82ba960b0b3468bb4717d4fa38
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: ATTACHMENTS_DIR
              value: /data/attachments
          envFrom:
            - secretRef:
                name: fai-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: attachments
              mountPath: /data/attachments
      volumes:
        - name: attachments
          persistentVolumeClaim:
            claimName: fai-attachments
