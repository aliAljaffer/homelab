---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fai-backend
  namespace: fai
  labels:
    app: fai-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fai-backend
  template:
    metadata:
      labels:
        app: fai-backend
    spec:
      containers:
        - name: fai-backend
          image: harbor.alialjaffer.com/mirror/fai-backend@sha256:8bfdbecf54f2c249f4454d5b8f12283d78cf3c21a8ea5addc5a16b3f77c16d53
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: ATTACHMENTS_DIR
              value: /data/attachments
            - name: STT_BASE_URL
              value: http://speaches.stt.svc.cluster.local:8000/v1
            - name: STT_MODEL
              value: Systran/faster-distil-whisper-small.en
            - name: STT_LANGUAGE
              value: en
          envFrom:
            - secretRef:
                name: fai-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: attachments
              mountPath: /data/attachments
      volumes:
        - name: attachments
          persistentVolumeClaim:
            claimName: fai-attachments
