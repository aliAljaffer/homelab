apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nexotv
  name: nexotv
  namespace: stremio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nexotv
  template:
    metadata:
      labels:
        app: nexotv
    spec:
      volumes:
      - name: nexotv-data
        persistentVolumeClaim:
          claimName: nexotv-data
      - name: nexotv-patches
        configMap:
          name: nexotv-patches
      containers:
      - image: savibrabo/nexotv:2.1.0
        name: nexotv
        env:
        - name: PORT
          value: "7000"
        - name: TRANSCODER_URL
          value: "http://nexotv-transcoder.stremio.svc.cluster.local:7001"
        - name: CONFIG_SECRET
          valueFrom:
            secretKeyRef:
              name: nexotv-secrets
              key: CONFIG_SECRET
        - name: FAVORITES
          value: "8k: bein,sa: bein,uk: sky sports premier league,uk: sky sports main event,uk: sky sports football,vip: sky sports premier league,vip: sky sports main event,vip: sky sports football,now: sky sports premier league,now: sky sports main event,now: sky sports football,uk: tnt sport,vip: tnt sport,now: tnt sport,4k: tnt,premier sport,-france,-rugby"
        volumeMounts:
        - name: nexotv-data
          mountPath: /app/data
        - name: nexotv-patches
          mountPath: /app/packages/backend/dist/src/config/env.js
          subPath: env.js
        - name: nexotv-patches
          mountPath: /app/packages/backend/dist/src/addon/M3UEPGAddon.js
          subPath: M3UEPGAddon.js
        - name: nexotv-patches
          mountPath: /app/packages/backend/dist/src/addon/builder.js
          subPath: builder.js
        - name: nexotv-patches
          mountPath: /app/packages/backend/dist/src/routes/stremio.js
          subPath: stremio.js
        ports:
        - containerPort: 7000
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
