---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: couchdb-default
  namespace: livesync
spec:
  endpointSelector:
    matchLabels:
      app: couchdb
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": cloudflare-tunnel-system
      toPorts:
        - ports:
            - port: "5984"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "5984"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
