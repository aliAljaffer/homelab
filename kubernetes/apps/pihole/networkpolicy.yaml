# Default-deny + explicit-allow for the pihole namespace.
# Matrix source: CONTEXT-networkpolicy-audit.md
#
# NOT yet wired into kustomization.yaml. Apply only after
# kubernetes/bootstrap/cilium/values.yaml's policyAuditMode: true has been
# rolled out and confirmed live (helm upgrade), so a mistake here logs
# instead of dropping real traffic.
#
# Caveats:
# - pihole-dns and pihole-web are also exposed directly via MetalLB
#   LoadBalancer IPs (192.168.8.153 for DNS; see pihole-service-*.yaml), so
#   LAN clients hit these pods without going through cloudflare-tunnel-system.
#   The 192.168.8.0/24 CIDR below assumes that's the full LAN range (matches
#   node IPs 192.168.8.99/.14 and this pihole's own ServerIP) - confirm
#   against the actual subnet before enforcing.
# - Gravity/adlist update egress (pihole periodically fetches blocklists over
#   HTTPS from various third-party hosts) is NOT covered here - the set of
#   FQDNs varies by configured adlist and isn't worth hardcoding. Leave this
#   namespace in audit mode through at least one gravity update cycle and add
#   toFQDNs entries for whatever it actually calls before enforcing.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pihole-default
  namespace: pihole
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": cloudflare-tunnel-system
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
      toPorts:
        - ports:
            - port: "9617"
              protocol: TCP
    - fromCIDR:
        - "192.168.8.0/24"
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
            - port: "80"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Upstream resolvers (PIHOLE_DNS_ in pihole-deployment.yaml).
    - toCIDR:
        - "8.8.8.8/32"
        - "8.8.4.4/32"
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
