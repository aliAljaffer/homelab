apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: pihole
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
    spec:
      containers:
        - name: pihole
          resources:
            limits:
              cpu: 500m
              memory: 1Gi  # 1.5M-domain adlist pushes gravity/FTL memory well past 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          image: pihole/pihole:latest
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
            - containerPort: 53
              name: dns-udp
              protocol: UDP
          env:
            - name: TZ
              value: Asia/Riyadh
            - name: WEBPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pihole-secret
                  key: WEBPASSWORD
            - name: ServerIP
              value: "192.168.8.153"  # MetalLB LoadBalancer IP for pihole-dns-udp
            - name: PIHOLE_DNS_
              value: "8.8.8.8;8.8.4.4"
            - name: FTLCONF_dns_listeningMode
              value: "ALL"
            - name: FTLCONF_dns_revServer_active
              value: "false"
          volumeMounts:
            - name: custom-dnsmasq
              mountPath: /etc/dnsmasq.d/02-custom.conf
              subPath: 02-custom.conf
            - name: pihole-data
              mountPath: /etc/pihole
        - name: exporter
          image: ekofr/pihole-exporter:latest
          ports:
            - containerPort: 9617
              name: metrics
              protocol: TCP
          env:
            - name: PIHOLE_HOSTNAME
              value: "127.0.0.1"
            - name: PIHOLE_PROTOCOL
              value: "http"
            - name: PIHOLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pihole-secret
                  key: WEBPASSWORD
            - name: PORT
              value: "9617"
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
      volumes:
        - name: custom-dnsmasq
          configMap:
            name: pihole-custom-dnsmasq
        - name: pihole-data
          persistentVolumeClaim:
            claimName: pihole-pvc
