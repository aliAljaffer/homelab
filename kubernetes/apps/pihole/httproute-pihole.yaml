---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pihole
  namespace: pihole
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - pihole.alialjaffer.com
  rules:
    - backendRefs:
        - name: pihole-web
          port: 80
