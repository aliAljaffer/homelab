---
# Neither ARC chart exposes a serviceMonitor toggle (confirmed via `helm
# show values`, zero matches) - metrics itself is gated behind an
# undocumented `metrics:` values block only visible in
# templates/deployment.yaml, set in arc-controller-values.yaml. Once
# enabled, both the controller and the listener pod it spawns expose a
# plain-HTTP /metrics port (no TLS/auth, confirmed live), so a PodMonitor
# works without any RBAC.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: arc-controller
  namespace: arc-systems
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gha-rs-controller
      app.kubernetes.io/component: controller-manager
  podMetricsEndpoints:
    - port: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: arc-runner-set-listener
  namespace: arc-systems
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: runner-scale-set-listener
  podMetricsEndpoints:
    - port: metrics
