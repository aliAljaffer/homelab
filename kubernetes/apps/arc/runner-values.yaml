# Shared values for every gha-runner-scale-set. The per-repo Application
# supplies githubConfigUrl (and the release name supplies the runs-on label).

# Pre-existing SealedSecret in arc-runners holding the `update-manifests-homelab`
# GitHub App credentials (github_app_id / github_app_installation_id /
# github_app_private_key). See github-app.sealed.yaml.
githubConfigSecret: github-app

minRunners: 0
maxRunners: 2

# ArgoCD renders the chart without the controller installed, so the chart's
# live lookup of the controller ServiceAccount fails. Point at it explicitly.
controllerServiceAccount:
  namespace: arc-systems
  name: arc-controller-gha-rs-controller

# Docker-in-Docker, spelled out manually instead of containerMode.type=dind so
# the sidecar can carry its own resource limits. Replaces the old custom runner
# image: workflows install what they need with setup-go / setup-node / apt.
template:
  spec:
    initContainers:
      - name: init-dind-externals
        image: ghcr.io/actions/actions-runner:2.334.0@sha256:b6614fce332517f74d0a76e7c762fb08e4f2ff13dcf333183397c8a5725b6e8e
        command: ["cp"]
        args: ["-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.334.0@sha256:b6614fce332517f74d0a76e7c762fb08e4f2ff13dcf333183397c8a5725b6e8e
        command: ["/home/runner/run.sh"]
        env:
          - name: DOCKER_HOST
            value: "unix:///var/run/docker.sock"
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: "120"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 3Gi
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
      - name: dind
        image: docker:29.9.2-dind@sha256:9e79b879b177fbd72c34376a3dd3d91747da5db49e1f560f76aea59561471977
        args:
          - dockerd
          - --host=unix:///var/run/docker.sock
          - --group=$(DOCKER_GROUP_GID)
        env:
          - name: DOCKER_GROUP_GID
            value: "123"
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 3Gi
        startupProbe:
          exec:
            command: ["docker", "info"]
          initialDelaySeconds: 0
          failureThreshold: 24
          periodSeconds: 5
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
    volumes:
      - name: work
        emptyDir: {}
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}
