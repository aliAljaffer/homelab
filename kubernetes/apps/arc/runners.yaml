# Runner scale sets, one Application per entry. `name` is the Helm release name,
# the scale set name, and therefore the `runs-on:` label used in the repo's
# workflows. Every entry uses the pod template in
# kubernetes/argocd/apps/workloads/arc-runners.yaml.
- name: arc-runner-set
  url: https://github.com/aliAljaffer/aliAljaffer.github.io
- name: arc-runner-fai
  url: https://github.com/aliAljaffer/fai
- name: arc-runner-grooszy
  url: https://github.com/aliAljaffer/grooszy
- name: arc-runner-chat-gateway
  url: https://github.com/aliAljaffer/chat-gateway
