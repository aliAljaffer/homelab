---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: arc-toolchain-warmer
  namespace: arc-runners
spec:
  selector:
    matchLabels:
      app: arc-toolchain-warmer
  template:
    metadata:
      labels:
        app: arc-toolchain-warmer
    spec:
      containers:
        - name: runner
          image: harbor.alialjaffer.com/mirror/runner-toolchain@sha256:7e9ec3de48cddc5ad2985ecfd7db6269d872dac8b03a7dfe0f46b8df122cecf7
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
        - name: dind
          image: harbor.alialjaffer.com/mirror/dind@sha256:97545b7bab66319a476800a85b008b25c06681733d484909e2a776281e41574f
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
