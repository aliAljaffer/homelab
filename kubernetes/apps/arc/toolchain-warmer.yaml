---
# Keeps the toolchain and dind images hot on every worker, so a fresh runner
# pod never waits on a 6.5 GB image pull. The build workflow bumps both digests.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: arc-toolchain-warmer
  namespace: arc-runners
spec:
  selector:
    matchLabels:
      app: arc-toolchain-warmer
  template:
    metadata:
      labels:
        app: arc-toolchain-warmer
    spec:
      containers:
        - name: runner
          image: harbor.alialjaffer.com/mirror/runner-toolchain@sha256:78dd06963314ee2b4a3105438342f12be8bfa1d6c41b37ec3656abbd804b4d9d
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
        - name: dind
          image: harbor.alialjaffer.com/mirror/dind@sha256:97545b7bab66319a476800a85b008b25c06681733d484909e2a776281e41574f
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
