---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: couchdb
  namespace: obsidian-sync
spec:
  selector:
    matchLabels:
      app: couchdb
  serviceName: couchdb-svc
  replicas: 1
  template:
    metadata:
      labels:
        app: couchdb
    spec:
      containers:
        - name: couchdb
          image: couchdb:3.3
          ports:
            - containerPort: 5984
              name: http
          envFrom:
            - secretRef:
                name: couchdb-secret   # SealedSecret: COUCHDB_USER, COUCHDB_PASSWORD
          env:
            - name: COUCHDB_SECRET
              valueFrom:
                secretKeyRef:
                  name: couchdb-secret
                  key: COUCHDB_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 5984
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /opt/couchdb/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: couchdb-pvc
