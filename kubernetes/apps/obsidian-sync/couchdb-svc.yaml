---
# Direct LoadBalancer access for Obsidian sync (doesn't go through HTTP Gateway)
apiVersion: v1
kind: Service
metadata:
  name: couchdb-svc
  namespace: obsidian-sync
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.8.134  # same IP as K3s cluster — change if conflict
  selector:
    app: couchdb
  ports:
    - port: 5984
      targetPort: 5984
      name: http
