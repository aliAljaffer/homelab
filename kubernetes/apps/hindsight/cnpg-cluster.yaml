---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hindsight-db
  namespace: hindsight
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17@sha256:70664ebcfa1100361b5bdc28bbf06fdbe08db2dc4ad7bd14de33c5e05fe8ea8e
  storage:
    size: 10Gi
    storageClass: longhorn
  enableSuperuserAccess: false
  backup:
    target: prefer-standby
    volumeSnapshot:
      online: true
  bootstrap:
    initdb:
      database: hindsight
      owner: hindsight
      secret:
        name: hindsight-postgres
      # Hindsight runs CREATE EXTENSION as the non-superuser owner, which cannot create vector.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
