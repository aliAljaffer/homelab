---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: free-models-sync
  namespace: hindsight
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: free-models-sync
  namespace: hindsight
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["hindsight-free-models"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: free-models-sync
  namespace: hindsight
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: free-models-sync
subjects:
  - kind: ServiceAccount
    name: free-models-sync
    namespace: hindsight
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hindsight-free-models-read
  namespace: hindsight
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["hindsight-free-models"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hindsight-free-models-read
  namespace: hindsight
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hindsight-free-models-read
subjects:
  - kind: ServiceAccount
    name: hindsight
    namespace: hindsight
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: free-models-sync
  namespace: hindsight
spec:
  schedule: "0 6 */2 * *"
  timeZone: UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: free-models-sync
        spec:
          serviceAccountName: free-models-sync
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: buildpack-deps:noble-scm
              env:
                - name: HOME
                  value: /tmp
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: HINDSIGHT_API_LLM_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: hindsight-env
                      key: HINDSIGHT_API_LLM_API_KEY
              command:
                - python3
                - /scripts/free-models-sync.py
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: free-models-sync
