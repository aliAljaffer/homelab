---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - hindsight-postgres.sealed.yaml
  - hindsight-env.sealed.yaml
  - cnpg-cluster.yaml
  - scheduled-backup.yaml
  - networkpolicy.yaml
  - ingress-tailnet.yaml
  - memory-store-deploy-key.sealed.yaml
  - memory-store-sync-cronjob.yaml
  - free-models-sync.yaml
configMapGenerator:
  - name: memory-store-sync
    namespace: hindsight
    files:
      - memory-store-sync.py
  - name: free-models-sync
    namespace: hindsight
    files:
      - free-models-sync.py
  - name: hindsight-llm-router
    namespace: hindsight
    files:
      - llm-router.py
    options:
      disableNameSuffixHash: true
