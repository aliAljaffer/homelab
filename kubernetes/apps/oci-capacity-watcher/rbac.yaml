---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oci-capacity-watcher
  namespace: oci-capacity-watcher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oci-capacity-watcher
  namespace: oci-capacity-watcher
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: ["oci-capacity-watcher"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oci-capacity-watcher
  namespace: oci-capacity-watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oci-capacity-watcher
subjects:
  - kind: ServiceAccount
    name: oci-capacity-watcher
    namespace: oci-capacity-watcher
