---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speaches
  namespace: stt
  labels:
    app: speaches
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: speaches
  template:
    metadata:
      labels:
        app: speaches
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: speaches
          image: ghcr.io/speaches-ai/speaches:latest-cpu@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
          env:
            - name: ENABLE_UI
              value: "false"
            - name: LOG_LEVEL
              value: info
            - name: WHISPER__INFERENCE_DEVICE
              value: cpu
            - name: WHISPER__COMPUTE_TYPE
              value: int8
            - name: WHISPER__CPU_THREADS
              value: "4"
            - name: WHISPER__TTL
              value: "-1"
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    for _ in $(seq 1 120); do
                      if curl -fsS -X POST "http://127.0.0.1:8000/v1/models/Systran/faster-distil-whisper-small.en" >/dev/null; then
                        exit 0
                      fi
                      sleep 5
                    done
                    exit 1
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /v1/models/Systran/faster-distil-whisper-small.en
              port: 8000
            periodSeconds: 10
          volumeMounts:
            - name: models
              mountPath: /home/ubuntu/.cache/huggingface/hub
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: speaches-models
