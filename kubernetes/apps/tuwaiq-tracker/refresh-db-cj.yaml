apiVersion: batch/v1
kind: CronJob
metadata:
  name: refresh-db
  namespace: tuwaiq-tracker
spec:
  jobTemplate:
    metadata:
      name: refresh-db
    spec:
      # Without this, a failed run sits around forever (failedJobsHistoryLimit
      # only caps *count*, not age) and KubeJobFailed keeps re-notifying every
      # repeat_interval until someone deletes it by hand.
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          containers:
          - image: curlimages/curl:8.20.0@sha256:eb411f0a02b75f2c2342dbc2f6579905979dd65f61f1b3047067829bb553d149
            name: refresh-db
            command:
            - sh
            args:
            - -c
            - 'curl -sS -H "Authorization: Bearer ${CRON_SECRET}" https://tuwaiqtracker.com/api/cron'
            resources:
              requests:
                cpu: 128m
                memory: 64Mi
              limits:
                memory: 128Mi
            env:
            - name: CRON_SECRET
              valueFrom:
                secretKeyRef:
                  name: tuwaiq-tracker-secrets
                  key: CRON_SECRET
          restartPolicy: OnFailure
  schedule: 0 */12 * * *
status: {}
