---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflared
data:
  config.yaml: |
    tunnel: fffe45f4-79d4-4538-a9d6-ae4ed2af455d
    credentials-file: /etc/cloudflared/creds/credentials.json

    metrics: 0.0.0.0:2000
    no-autoupdate: true

    ingress:
      # --- Remote cluster access (protected by Cloudflare Access ZT) ---
      # kubectl: cloudflared access tcp --hostname kubectl.alialjaffer.com --url localhost:6443
      - hostname: kubectl.alialjaffer.com
        service: tcp://192.168.8.100:6443
        originRequest:
          noTLSVerify: true

      # talosctl: cloudflared access tcp --hostname talos.alialjaffer.com --url localhost:50000
      - hostname: talos.alialjaffer.com
        service: tcp://192.168.8.100:50000
        originRequest:
          noTLSVerify: true

      # --- Application traffic ---
      - hostname: team4.tuwaiqtracker.com
        path: ^/api(/.*)?$
        service: http://catus-locatus-svc.catus-locatus.svc.cluster.local:4001

      - hostname: minio.tuwaiqtracker.com
        service: http://minio-svc.catus-locatus.svc.cluster.local:9000

      - hostname: team4.tuwaiqtracker.com
        service: http://cl-fe-svc.catus-locatus.svc.cluster.local:80

      - service: http_status:404
