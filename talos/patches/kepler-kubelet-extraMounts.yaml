---
# Kubelet extraMounts required for Kepler (https://sustainable-computing.io/kepler/)
# Kepler's DaemonSet mounts host /sys and /proc via hostPath so it can read
# RAPL powercap (Intel RAPL / AMD Energy Engine) and /proc/cpu info.
# On Talos the kubelet has its own mount namespace, so those host paths must
# be explicitly bind-mounted into the kubelet container, otherwise Kepler pods
# get empty/zero readings.
#
# Apply to a node:
#   talosctl patch mc -n <node> --endpoints 127.0.0.1 \
#     --talosconfig ~/.kube/..talosconfig --patch @talos/patches/kepler-kubelet-extraMounts.yaml
#
# Mirrored into talconfig.yaml controlPlane.patches and worker.patches so that
# `talosctl gen config` regenerates configs that already include these mounts.
machine:
  kubelet:
    extraMounts:
      - destination: /sys
        type: bind
        source: /sys
        options:
          - bind
          - ro
          - rshared
      - destination: /proc
        type: bind
        source: /proc
        options:
          - bind
          - ro
          - rshared