---
clusterName: k8s-homelab
talosVersion: v1.13.7
kubernetesVersion: v1.36.2
endpoint: https://api.alialjaffer.com:6443
additionalApiServerCertSans:
- api.alialjaffer.com
- 192.168.8.250
allowSchedulingOnControlPlanes: true

cniConfig:
  name: none

clusterPodNets:
- 10.244.0.0/16
clusterSvcNets:
- 10.96.0.0/12

nodes:
- hostname: cp0
  ipAddress: 192.168.8.99
  installDisk: /dev/sda
  controlPlane: true
  networkInterfaces:
  - deviceSelector:
      hardwareAddr: "*"
    dhcp: true
    vip:
      ip: 192.168.8.250

- hostname: wrk0
  ipAddress: 192.168.8.101
  installDisk: /dev/nvme0n1
  controlPlane: true
  networkInterfaces:
  - deviceSelector:
      hardwareAddr: "*"
    dhcp: true
    vip:
      ip: 192.168.8.250

- hostname: wrk1
  ipAddress: 192.168.8.102
  installDisk: /dev/nvme0n1
  controlPlane: true
  networkInterfaces:
  - deviceSelector:
      hardwareAddr: "*"
    dhcp: true
    vip:
      ip: 192.168.8.250

- hostname: wrk2
  ipAddress: 192.168.8.103
  installDisk: /dev/nvme0n1
  controlPlane: false
  networkInterfaces:
  - deviceSelector:
      hardwareAddr: "*"
    dhcp: true

- hostname: wrk3
  ipAddress: 192.168.8.100
  installDisk: /dev/nvme0n1
  controlPlane: false
  networkInterfaces:
  - deviceSelector:
      hardwareAddr: "*"
    dhcp: true

controlPlane:
  extensions:
  - image: ghcr.io/siderolabs/intel-ucode:20250211
  patches:
  - |-
    cluster:
      network:
        cni:
          name: none
      proxy:
        disabled: true
      # Exposed so kube-prometheus-stack can scrape :10257/:10259.
      controllerManager:
        extraArgs:
          bind-address: 0.0.0.0
      scheduler:
        extraArgs:
          bind-address: 0.0.0.0
    machine:
      kubelet:
        extraArgs:
          rotate-server-certificates: "true"
        # /sys must not be mounted: rshared back-propagates and corrupts the host cgroup2 mount.
        extraMounts:
          - destination: /proc
            type: bind
            source: /proc
            options:
              - bind
              - ro
              - rprivate

worker:
  patches:
  - |-
    cluster:
      proxy:
        disabled: true
    machine:
      kubelet:
        extraArgs:
          rotate-server-certificates: "true"
        # /sys must not be mounted: rshared back-propagates and corrupts the host cgroup2 mount.
        extraMounts:
          - destination: /proc
            type: bind
            source: /proc
            options:
              - bind
              - ro
              - rprivate
