---
clusterName: k8s-homelab
talosVersion: v1.13.7
kubernetesVersion: v1.36.2
endpoint: https://192.168.8.99:6443
allowSchedulingOnControlPlanes: false

# ⚠️ Topology change (2026-08-08): control plane moved from the M920q
# (was cp0, 192.168.8.100, now repurposed below as wrk3) to a MacBook Pro
# (cp0, 192.168.8.99). The Mac requires a NON-STANDARD install: a custom
# kernel (Clang+LLD/ThinLTO disabled) and GRUB instead of systemd-boot,
# neither of which talhelper/the standard `talosctl apply-config` install
# flow can produce. Do NOT run `talhelper genconfig` + a normal install
# against cp0's IP without following docs/talos-intel-mac.md first, or it
# will install standard Talos and hang at boot on this hardware again.
# The declaration below is for config-only operations (patches, upgrades
# to an already-installed node) — not a fresh-install source of truth
# for this specific node.

cniConfig:
  name: none # Cilium installed via bootstrap, not Talos default (Flannel)

clusterPodNets:
- 10.244.0.0/16
clusterSvcNets:
- 10.96.0.0/12

nodes:
# MacBook Pro (Mid-2012, 13"). See the topology-change note above and
# docs/talos-intel-mac.md — do not treat this entry as a fresh-install
# source of truth without following that doc.
- hostname: cp0
  ipAddress: 192.168.8.99
  installDisk: /dev/sda
  controlPlane: true
  networkInterfaces:
  - deviceSelector:
      hardwareAddr: "*"
    dhcp: true

- hostname: wrk0
  ipAddress: 192.168.8.101
  installDisk: /dev/nvme0n1
  controlPlane: false
  networkInterfaces:
  - deviceSelector:
      hardwareAddr: "*"
    dhcp: true

- hostname: wrk1
  ipAddress: 192.168.8.102
  installDisk: /dev/nvme0n1
  controlPlane: false
  networkInterfaces:
  - deviceSelector:
      hardwareAddr: "*"
    dhcp: true

- hostname: wrk2
  ipAddress: 192.168.8.103
  installDisk: /dev/nvme0n1
  controlPlane: false
  networkInterfaces:
  - deviceSelector:
      hardwareAddr: "*"
    dhcp: true

# M920q Tiny that used to be cp0, repurposed as a worker (2026-08-08).
- hostname: wrk3
  ipAddress: 192.168.8.100
  installDisk: /dev/nvme0n1
  controlPlane: false
  networkInterfaces:
  - deviceSelector:
      hardwareAddr: "*"
    dhcp: true

# NOTE: cp0 is now Mac hardware and does not need/want intel-ucode via this
# blanket section for a standard install (moot anyway since cp0 can't use
# the standard install path — see the topology note above). Left in place
# for if another M920q ever becomes an additional control-plane node.
controlPlane:
  extensions:
  - image: ghcr.io/siderolabs/intel-ucode:20250211
  patches:
  - |-
    cluster:
      network:
        cni:
          name: none
      proxy:
        disabled: true
    machine:
      kubelet:
        extraArgs:
          rotate-server-certificates: "true"

# Patches applied to all worker nodes
worker:
  patches:
  - |-
    cluster:
      proxy:
        disabled: true
    machine:
      kubelet:
        extraArgs:
          rotate-server-certificates: "true"
  extensions:
  # Longhorn storage dependencies
  - image: ghcr.io/siderolabs/iscsi-tools:v0.2.0
  - image: ghcr.io/siderolabs/util-linux-tools:2.41.4
  # Intel M920q Tiny: CPU microcode (required for security/stability on bare metal)
  - image: ghcr.io/siderolabs/intel-ucode:20250211
  # Intel M920q Tiny: UHD 630 iGPU driver (enables Quick Sync transcoding via VA-API)
  - image: ghcr.io/siderolabs/i915:20250609
