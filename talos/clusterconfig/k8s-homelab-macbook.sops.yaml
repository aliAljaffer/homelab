    secretboxEncryptionSecret: ENC[AES256_GCM,data:C3W9438cVED7jeCvkDk49uXlX2N9CN8+upt4KKY23GmIruDxITpdN07iaN0=,iv:uzCNiqcrBzApd+iHkbUyMf/UzD5CDpmiNmSqekxRmbY=,tag:D3mdgA5zO6brm5ZElzZ/KA==,type:str] # A key used for the [encryption of secret data at rest](https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/).
    # The base64 encoded root certificate authority used by Kubernetes.
    ca:
        crt: 
        key: ENC[AES256_GCM,data:,iv:szdgW4nN98RH/VtUglCZKqLY4sFCAt72RyVDIytAywA=,tag:ibBthcR6ylSzOliroq8N+Q==,type:str]
