    aggregatorCA:
        crt: 
        key: ENC[AES256_GCM,data:,iv:ujaw01pNsKYwj//ixBWL/iCmejA7x2/BZ5walGpqj+Y=,tag:6f3W4bgRri+vtHy7xcdWug==,type:str]
